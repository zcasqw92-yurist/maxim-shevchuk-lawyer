name: Temp fix designer workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-fix-designer-workflow.yml

permissions:
  contents: write

jobs:
  fix-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/designer-infographic-exclusive-rights
          fetch-depth: 0
      - name: Fix Python booleans and trigger publication workflow
        shell: bash
        run: |
          sed -i 's/: false/: False/g; s/: true/: True/g' .github/workflows/temp-finish-designer-rights-pr.yml
          rm -f .github/workflows/temp-fix-designer-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить служебный manifest C-025"
          git push origin HEAD:agent/designer-infographic-exclusive-rights
