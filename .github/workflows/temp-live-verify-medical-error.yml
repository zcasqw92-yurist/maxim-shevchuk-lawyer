name: Temp live verify medical-error article

on:
  pull_request:
    paths:
      - '.github/workflows/temp-live-verify-medical-error.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for expected SHA and verify live article
        shell: bash
        env:
          EXPECTED_SHA: '834d0b5805e01253d53b65870d57cf02c8b88a62'
          ARTICLE_URL: 'https://yuristshevchuk.com/razbory/vrachebnaya-oshibka-pri-rodah-s-chego-nachat/'
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 36); do
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://yuristshevchuk.com/build-info.json?nonce=$(date +%s)-${attempt}" \
              -o build-info.json || true
            if grep -Fq "$EXPECTED_SHA" build-info.json 2>/dev/null; then
              found='yes'
              break
            fi
            sleep 10
          done
          test "$found" = 'yes'
          grep -Fq '"articles": 23' build-info.json
          grep -Fq '"practiceCases": 2' build-info.json

          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -H 'Cache-Control: no-cache' \
            "${ARTICLE_URL}?nonce=$(date +%s)" \
            -o article.html
          grep -Fq 'Врачебная ошибка при родах: с чего начать и как проверить основания для компенсации' article.html
          grep -Fq 'Как связать симптомы, действия врачей и последствия' article.html
          grep -Fq 'https://yuristshevchuk.com/razbory/vrachebnaya-oshibka-pri-rodah-s-chego-nachat/' article.html
          grep -Fq 'index,follow' article.html
          grep -Fq "$EXPECTED_SHA" article.html
          echo 'LIVE_VERIFY_SUCCESS'
