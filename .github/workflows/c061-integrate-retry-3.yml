name: Integrate C-061 article retry 3

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c061-integrate-retry-3.yml'

permissions:
  contents: write

concurrency:
  group: c061-final-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SITE_PRODUCTION: 'true'
      SITE_URL: 'https://yuristshevchuk.com'
      SITE_BASE_PATH: ''
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION }}
      SITE_ANALYTICS_ENABLED: 'true'
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
      YANDEX_METRICA_ID: '111050150'
      SITE_VIDEO_ENABLED: ${{ vars.SITE_VIDEO_ENABLED || 'false' }}
      SITE_VIDEO_TITLE: ${{ vars.SITE_VIDEO_TITLE }}
      SITE_VIDEO_DURATION: ${{ vars.SITE_VIDEO_DURATION }}
      SITE_VIDEO_POSTER: ${{ vars.SITE_VIDEO_POSTER }}
      SITE_VIDEO_WEBM: ${{ vars.SITE_VIDEO_WEBM }}
      SITE_VIDEO_MP4: ${{ vars.SITE_VIDEO_MP4 }}
      SITE_VIDEO_CAPTIONS: ${{ vars.SITE_VIDEO_CAPTIONS }}
      INDEXNOW_KEY: ci-indexnow-key
      CROSS_BROWSER_REQUIRED: 'true'
      CONTENT_GOVERNANCE_BASE_SHA: c7c4980ee33cd937f8d27380653af332c1c19915

    steps:
      - name: Checkout article branch
        uses: actions/checkout@v4
        with:
          ref: agent/c061-unshipped-goods-article
          fetch-depth: 0

      - name: Set review date
        run: echo "SITE_REVIEW_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Align intent, public wording and SEO title
        run: |
          python3 - <<'PY'
          from pathlib import Path

          integration = Path('scripts/integrate-c061.mjs')
          text = integration.read_text()
          old_intent = 'вернуть предпринимателю оплату за товар, не поставленный после оплаты счёта без отдельного договора'
          new_intent = 'доказать сделку по оплаченному счёту без отдельного договора, выбрать возврат оплаты за непоставленный товар и пройти претензионный порядок между предпринимателями'
          if old_intent not in text:
              raise SystemExit('SERP intent marker not found')
          integration.write_text(text.replace(old_intent, new_intent, 1))

          article = Path('src/unshipped-goods-after-invoice-data.mjs')
          text = article.read_text()
          replacements = {
              'seoTitle: "Товар не поставлен после оплаты счёта: возврат денег",': 'seoTitle: "Не поставили товар после оплаты: возврат денег",',
              'Соберите доказательственную цепочку из шести звеньев': 'Какие документы подтвердят заказ, оплату и непоставку товара',
              'До подачи иска проверьте актуальные реквизиты ответчика, подсудность, доказательства отправки претензии, расчёт суммы и документы, подтверждающие полномочия подписанта. Суду нужно представить не только факт оплаты, но и полную договорную и доказательственную цепочку.': 'До подачи иска проверьте реквизиты поставщика, какой суд должен рассматривать спор, сохранились ли доказательства отправки претензии и верно ли рассчитана сумма. Одного платёжного поручения недостаточно: суду нужно показать, какой товар был заказан, когда его должны были передать и почему обязанность не исполнена.',
              'Обычная просрочка поставки сама по себе является гражданским спором. Уголовно-правовой маршрут оценивается отдельно, когда есть подтверждённые признаки первоначального умысла завладеть деньгами без намерения исполнять обязательство.': 'Сам по себе срыв срока поставки обычно решается через претензию и арбитражный суд. Обращение в полицию имеет смысл рассматривать отдельно только тогда, когда есть конкретные данные, что деньги изначально получили без намерения поставлять товар.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Marker not found: {old}')
              text = text.replace(old, new, 1)
          article.write_text(text)
          PY

      - name: Integrate governed content
        run: node scripts/integrate-c061.mjs

      - name: Remove temporary research automation
        run: |
          rm -f \
            config/c061-serp.json \
            scripts/c061-yandex-serp.mjs \
            scripts/c061-google-serp.mjs \
            scripts/c061-google-public-serp.mjs \
            scripts/c061-google-programmable-serp.mjs \
            scripts/integrate-c061.mjs \
            .github/workflows/c061-serp.yml \
            .github/workflows/c061-integrate.yml \
            .github/workflows/c061-integrate-retry.yml \
            .github/workflows/c061-integrate-retry-2.yml \
            .github/workflows/c061-integrate-retry-3.yml

      - name: Run full production contract
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/live-all-publications-smoke.mjs
          npm run check 2>&1 | tee /tmp/c061-check.log

      - name: Commit verified article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Опубликовать разбор о непоставленном товаре между ИП"
          git push origin HEAD:agent/c061-unshipped-goods-article
