name: Обновить число канонических URL

on:
  push:
    branches:
      - agent/contract-engine-no-receipt-article
    paths:
      - .github/workflows/fix-production-url-count.yml

permissions:
  contents: write

jobs:
  update-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Получить ветку
        uses: actions/checkout@v4
        with:
          ref: agent/contract-engine-no-receipt-article
          fetch-depth: 0

      - name: Обновить production-паспорт
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/current-production-state.md')
          text = path.read_text(encoding='utf-8')
          old = '- 35 канонических содержательных URL: главная, каталог и семь страниц услуг, раздел и девятнадцать юридических разборов, раздел и два полных кейса практики, страница о юристе, контакты и политика конфиденциальности;'
          new = '- 36 канонических содержательных URL: главная, каталог и семь страниц услуг, раздел и двадцать юридических разборов, раздел и два полных кейса практики, страница о юристе, контакты и политика конфиденциальности;'
          if old not in text:
              raise SystemExit('Прежний маркер канонических URL не найден')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Зафиксировать изменение
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-production-state.md
          git commit -m "Обновить production-паспорт до 36 URL"
          git push origin HEAD:agent/contract-engine-no-receipt-article
