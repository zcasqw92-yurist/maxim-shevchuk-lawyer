name: Cleanup C-061 test artifacts 2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c061-cleanup-2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout article branch
        uses: actions/checkout@v4
        with:
          ref: agent/c061-unshipped-goods-article
          fetch-depth: 0

      - name: Remove generated files and cleanup workflows
        run: |
          rm -rf \
            reports/diploma-layout \
            reports/engagement-nudge \
            reports/hero-consent
          rm -f \
            .github/workflows/c061-cleanup.yml \
            .github/workflows/c061-cleanup-2.yml

      - name: Commit clean publication diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Очистить служебные артефакты проверки C-061"
          git push origin HEAD:agent/c061-unshipped-goods-article
