name: Temp fix bailiff SEO title

on:
  pull_request:
    paths:
      - '.github/workflows/temp-fix-bailiff-seo-title.yml'

permissions:
  contents: write

jobs:
  patch-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Shorten SEO title and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          article = Path('src/bailiff-small-pension-payments-data.mjs')
          text = article.read_text(encoding='utf-8')
          old = 'seoTitle: "Маленькие выплаты от пристава: что делать взыскателю",'
          new = 'seoTitle: "Пристав перечисляет мало: что делать взыскателю",'
          if old not in text:
              raise SystemExit('Исходный SEO-title не найден')
          title = new.split('"')[1]
          if len(title) > 65:
              raise SystemExit(f'Новый SEO-title длиннее лимита: {len(title)}')
          article.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/temp-fix-bailiff-seo-title.yml').unlink()
          print(f'Новая длина SEO-title: {len(title)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/bailiff-small-pension-payments-data.mjs .github/workflows/temp-fix-bailiff-seo-title.yml
          git commit -m 'Сократить SEO-title статьи C-024'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
