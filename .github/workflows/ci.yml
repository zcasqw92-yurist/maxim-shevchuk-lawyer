name: Проверка опубликованных отступов маркеров

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Проверить основной домен
        run: node scripts/verify-marker-spacing-live-008d.mjs
