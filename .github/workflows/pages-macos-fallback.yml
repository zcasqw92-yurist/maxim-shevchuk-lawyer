name: Deploy GitHub Pages (macOS fallback)

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Fallback получает собственную concurrency-группу. Это критично: workflow_run
# создаётся после любого завершения основного Pages workflow, в том числе после
# отменённого устаревшего run, и не должен сам отменять более новый основной deploy.
concurrency:
  group: pages-fallback
  cancel-in-progress: true

env:
  SITE_PRODUCTION: 'true'
  SITE_URL: 'https://yuristshevchuk.com'
  SITE_BASE_PATH: ''
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
  YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION }}
  SITE_ANALYTICS_ENABLED: 'true'
  GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
  YANDEX_METRICA_ID: '111050150'
  YANDEX_METRICA_OAUTH_TOKEN: ${{ secrets.YANDEX_METRICA_OAUTH_TOKEN }}
  SITE_VIDEO_ENABLED: ${{ vars.SITE_VIDEO_ENABLED || 'false' }}
  SITE_VIDEO_TITLE: ${{ vars.SITE_VIDEO_TITLE }}
  SITE_VIDEO_DURATION: ${{ vars.SITE_VIDEO_DURATION }}
  SITE_VIDEO_POSTER: ${{ vars.SITE_VIDEO_POSTER }}
  SITE_VIDEO_WEBM: ${{ vars.SITE_VIDEO_WEBM }}
  SITE_VIDEO_MP4: ${{ vars.SITE_VIDEO_MP4 }}
  SITE_VIDEO_CAPTIONS: ${{ vars.SITE_VIDEO_CAPTIONS }}
  INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
  CROSS_BROWSER_REQUIRED: 'true'
  CONTENT_GOVERNANCE_BASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  gate:
    name: Confirm infrastructure-only failure
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: macos-14
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.decide.outputs.allowed }}
    steps:
      - name: Decide whether fallback should run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Manual macOS fallback approved."
            exit 0
          fi

          api="${GITHUB_API_URL}/repos/${REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          jobs_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100")"

          failed_count="$(jq '[.jobs[] | select(.conclusion == "failure")] | length' <<<"${jobs_json}")"
          setup_only_count="$(jq '[.jobs[] | select(.conclusion == "failure") | select(
            ((.steps | length) == 0) or
            ((.steps | length) == 1 and .steps[0].name == "Set up job" and .steps[0].conclusion == "failure")
          )] | length' <<<"${jobs_json}")"

          if (( failed_count > 0 && failed_count == setup_only_count )); then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            echo "Linux workflow failed before repository code ran; macOS fallback approved."
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Fallback blocked: the source failure reached repository code or had no failed job."
          fi

  build:
    name: Build and validate on macOS
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set automated review date
        run: echo "SITE_REVIEW_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.17.0'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install chromium firefox webkit

      - name: Build and validate production site
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/live-all-publications-smoke.mjs
          node --check scripts/live-public-copy-regression-test.mjs
          node --check scripts/verify-custom-domain-sha.mjs
          node --check scripts/deploy-pages-with-extended-wait.mjs
          npm run check 2>&1 | tee check.log

      - name: Verify Yandex Metrica goals and funnels
        shell: bash
        run: |
          set -o pipefail
          node scripts/metrica-state-test.mjs 2>&1 | tee metrica-state.log

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: macos-fallback-check-diagnostics-${{ github.run_id }}
          path: |
            check.log
            metrica-state.log
            reports
            test-results
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages from macOS
    needs: build
    runs-on: macos-14
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      status: ${{ steps.deployment.outputs.status }}
    steps:
      - name: Checkout deployment client
        uses: actions/checkout@v6

      - name: Setup deployment Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.17.0'
          package-manager-cache: false

      - name: Deploy to GitHub Pages with extended wait
        id: deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_DEPLOYMENT_TIMEOUT_MS: '2100000'
          PAGES_STATUS_INTERVAL_MS: '10000'
          PAGES_STATUS_ERROR_LIMIT: '18'
        run: node scripts/deploy-pages-with-extended-wait.mjs

  verify:
    name: Verify published site from macOS
    needs: deploy
    if: needs.deploy.outputs.status == 'succeed'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set automated review date
        run: echo "SITE_REVIEW_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.17.0'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install live verification browsers
        run: npx playwright install chromium webkit

      - name: Verify published build
        env:
          SITE_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail
          {
            npm run test:live
            node scripts/live-all-publications-smoke.mjs
          } 2>&1 | tee live-verify.log

      - name: Verify SHA through custom domain
        env:
          SITE_CUSTOM_DOMAIN_URL: ${{ env.SITE_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          CUSTOM_DOMAIN_VERIFY_ATTEMPTS: '30'
          CUSTOM_DOMAIN_VERIFY_DELAY_MS: '10000'
        run: node scripts/verify-custom-domain-sha.mjs

      - name: Recheck all published articles after verified deployment
        env:
          SITE_PUBLIC_URL: ${{ env.SITE_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node scripts/live-public-copy-regression-test.mjs

      - name: Upload custom-domain and public-copy diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: macos-fallback-live-diagnostics-${{ github.run_id }}
          path: |
            live-verify.log
            reports/live-publication-smoke.json
            reports/custom-domain-sha-verification.json
            reports/public-copy-regression.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify IndexNow about changed pages
        run: INDEXNOW_CHANGED_DATE="$SITE_REVIEW_DATE" npm run submit:indexnow
