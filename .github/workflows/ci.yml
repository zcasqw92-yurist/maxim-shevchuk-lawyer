name: Проверка сайта

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Проверить опубликованную карточку услуги в кейсах
        shell: bash
        env:
          SITE_CUSTOM_DOMAIN_URL: https://yuristshevchuk.com
          EXPECTED_BUILD_SHA: 1443c8ca0008ecea9ef61e824646ffc6b8022886
          CUSTOM_DOMAIN_VERIFY_ATTEMPTS: '150'
          CUSTOM_DOMAIN_VERIFY_DELAY_MS: '10000'
        run: |
          node scripts/verify-custom-domain-sha.mjs
          node --input-type=module <<'NODE'
          const url = new URL('/assets/styles.css', process.env.SITE_CUSTOM_DOMAIN_URL);
          url.searchParams.set('case_service_card_check', `${process.env.EXPECTED_BUILD_SHA.slice(0, 12)}-${Date.now()}`);
          const response = await fetch(url, {
            headers: { 'cache-control': 'no-cache, no-store, max-age=0', pragma: 'no-cache' },
            cache: 'no-store',
            redirect: 'follow',
          });
          if (!response.ok) throw new Error(`styles.css returned ${response.status}`);
          const css = await response.text();
          const required = [
            '.case-page .editorial-case-aside > a[href^="/uslugi/"]',
            'content: "Услуга по теме"',
            'content: "Перейти к услуге  →"',
          ];
          for (const marker of required) {
            if (!css.includes(marker)) throw new Error(`Published styles are missing: ${marker}`);
          }
          console.log(`Published case service card verified in ${response.url}`);
          NODE

      - name: Сохранить диагностику при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: case-service-card-live-${{ github.run_id }}
          path: reports/custom-domain-sha-verification.json
          if-no-files-found: ignore
          retention-days: 7
