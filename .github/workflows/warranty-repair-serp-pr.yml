name: Проверка выдачи — гарантийный ремонт более 45 дней

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: seo-api
    env:
      QUERY_TEXT: гарантийный ремонт автомобиля более 45 дней что делать
      YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Снять органическую выдачу Яндекса и Google
        run: node .github/scripts/warranty-serp.mjs

      - name: Сохранить снимок выдачи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warranty-repair-serp-research
          path: reports/cluster-research/warranty-repair-serp.json
          if-no-files-found: error
          retention-days: 14
