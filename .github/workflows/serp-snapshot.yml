name: Слепок органической выдачи

on:
  push:
    branches:
      - 'agent/refund-services-serp-snapshot'
    paths:
      - 'config/refund-services-serp.json'
      - 'scripts/yandex-search-api-serp.mjs'
      - 'scripts/google-serp-api.mjs'
      - 'scripts/google-public-serp.mjs'
      - '.github/workflows/serp-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  snapshot:
    environment: seo-api
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Снять Яндекс через Search API
        id: yandex_api
        continue-on-error: true
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
        run: node scripts/yandex-search-api-serp.mjs

      - name: Снять Google через SERP API
        id: google_api
        continue-on-error: true
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node scripts/google-serp-api.mjs

      - name: Установить Chromium для резервного Google
        run: npx playwright install --with-deps chromium

      - name: Снять Google через официальные домены
        id: google_public
        continue-on-error: true
        run: node scripts/google-public-serp.mjs

      - name: Сохранить отчёт и диагностику
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refund-services-serp-snapshot
          path: reports/serp-snapshots/refund-services/
          if-no-files-found: warn
          retention-days: 14

      - name: Записать результат в pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const readJson = (path) => {
              try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
              catch (error) { core.warning(`${path} unavailable: ${error.message}`); return null; }
            };
            const yandexReport = readJson('reports/serp-snapshots/refund-services/yandex-api.json');
            const googleApiReport = readJson('reports/serp-snapshots/refund-services/google-api.json');
            const googlePublicReport = readJson('reports/serp-snapshots/refund-services/google-public.json');
            const yandexById = new Map((yandexReport?.queries || []).map((item) => [item.id, item]));
            const googleApiById = new Map((googleApiReport?.queries || []).map((item) => [item.id, item]));
            const googlePublicById = new Map((googlePublicReport?.queries || []).map((item) => [item.id, item]));
            const pickGoogle = (id) => googleApiById.get(id)?.minimumMet
              ? googleApiById.get(id)
              : (googlePublicById.get(id)?.minimumMet
                ? googlePublicById.get(id)
                : (googleApiById.get(id) || googlePublicById.get(id) || {}));
            const queryIds = [...new Set([
              ...(yandexReport?.queries || []).map((item) => item.id),
              ...(googleApiReport?.queries || []).map((item) => item.id),
              ...(googlePublicReport?.queries || []).map((item) => item.id),
            ])];

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/', '')}`;
            const { data: pulls } = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (!pulls.length) {
              core.warning(`No open pull request found for ${head}`);
              return;
            }

            const combinedGate = Boolean(queryIds.length && queryIds.every((id) =>
              yandexById.get(id)?.minimumMet && pickGoogle(id).minimumMet
            ));
            const lines = [
              '## Автоматический SERP-снимок',
              '',
              `Объединённый шлюз пройден: **${combinedGate ? 'да' : 'нет'}**`,
              '',
              '| Гипотеза | Яндекс: органика / реклама | Google: органика / реклама |',
              '|---|---:|---:|',
            ];

            for (const id of queryIds) {
              const yandex = yandexById.get(id) || {};
              const google = pickGoogle(id);
              const query = yandex.query || google.query || id;
              lines.push(`| ${query} | ${yandex.organicResultsReviewed ?? 0} / ${yandex.sponsoredResultsObserved ?? 0} (${yandex.status || 'нет'}) | ${google.organicResultsReviewed ?? 0} / ${google.sponsoredResultsObserved ?? 0} (${google.status || 'нет'}) |`);
            }

            const errors = [];
            for (const id of queryIds) {
              const yandex = yandexById.get(id) || {};
              const google = pickGoogle(id);
              const query = yandex.query || google.query || id;
              if (!yandex.minimumMet) errors.push(`Яндекс — ${query}: ${yandex.diagnostics?.reason || 'не получено пять органических результатов'}`);
              if (!google.minimumMet) errors.push(`Google — ${query}: ${google.diagnostics?.reason || 'не получено пять органических результатов'}`);
            }
            if (errors.length) lines.push('', '### Диагностика', ...errors.slice(0, 12).map((value) => `- ${value}`));

            lines.push('', '### Проверенные органические результаты');
            for (const id of queryIds) {
              const yandex = yandexById.get(id) || {};
              const google = pickGoogle(id);
              const query = yandex.query || google.query || id;
              lines.push('', `**${query}**`);
              if (yandex.minimumMet) {
                lines.push(`- Яндекс: ${yandex.organicResults.slice(0, 5).map((entry, index) => `${index + 1}) ${entry.domain} — ${entry.title}`).join('; ')}`);
              }
              if (google.minimumMet) {
                lines.push(`- Google: ${google.organicResults.slice(0, 5).map((entry, index) => `${index + 1}) ${entry.domain} — ${entry.title}`).join('; ')}`);
              }
            }
            lines.push('', `Google source: ${googleApiReport?.gatePassed ? googleApiReport.source : 'public browser fallback'}`);
            lines.push('', `Workflow commit: \`${context.sha}\``);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pulls[0].number,
              body: lines.join('\n'),
            });

      - name: Проверить объединённый шлюз
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (path) => {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch { return null; }
          };
          const yandex = read('reports/serp-snapshots/refund-services/yandex-api.json');
          const googleApi = read('reports/serp-snapshots/refund-services/google-api.json');
          const googlePublic = read('reports/serp-snapshots/refund-services/google-public.json');
          const yandexById = new Map((yandex?.queries || []).map((item) => [item.id, item]));
          const googleApiById = new Map((googleApi?.queries || []).map((item) => [item.id, item]));
          const googlePublicById = new Map((googlePublic?.queries || []).map((item) => [item.id, item]));
          const pickGoogle = (id) => googleApiById.get(id)?.minimumMet
            ? googleApiById.get(id)
            : googlePublicById.get(id);
          const passed = Boolean(
            yandex?.queries?.length &&
            yandex.queries.every((item) => item.minimumMet && pickGoogle(item.id)?.minimumMet)
          );
          console.log(`Combined SERP gate passed: ${passed}`);
          if (!passed) process.exit(1);
          NODE

# API-слой Google готов принимать SERPER_API_KEY или SERPAPI_API_KEY.
# Повторный запуск после добавления SERPER_API_KEY: 2026-07-31T13:37:00+02:00
