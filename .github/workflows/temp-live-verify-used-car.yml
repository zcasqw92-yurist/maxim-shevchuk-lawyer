name: Temp live verify used-car article

on:
  pull_request:
    paths:
      - '.github/workflows/temp-live-verify-used-car.yml'

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify expected SHA and live article
        shell: bash
        env:
          EXPECTED_SHA: '26ea438cd0075aa6a09420a3406aeff4f5527c3a'
          ARTICLE_URL: 'https://yuristshevchuk.com/razbory/skrytyy-defekt-poderzhannogo-avtomobilya/'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -H 'Cache-Control: no-cache' \
            "https://yuristshevchuk.com/build-info.json?nonce=$(date +%s)" \
            -o build-info.json
          grep -Fq "$EXPECTED_SHA" build-info.json

          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -H 'Cache-Control: no-cache' \
            "${ARTICLE_URL}?nonce=$(date +%s)" \
            -o article.html
          grep -Fq 'Купили подержанный автомобиль со скрытым дефектом: что делать до ремонта' article.html
          grep -Fq 'Матрица скрытого недостатка подержанного автомобиля' article.html
          grep -Fq 'https://yuristshevchuk.com/razbory/skrytyy-defekt-poderzhannogo-avtomobilya/' article.html
          grep -Fq 'index,follow' article.html
          grep -Fq "$EXPECTED_SHA" article.html
          echo 'LIVE_VERIFY_SUCCESS'
