name: Интегрировать статью о гарантийном ремонте

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.head_ref == 'content/warranty-repair-45-days-20260801'
    runs-on: ubuntu-latest
    steps:
      - name: Получить ветку публикации
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Интегрировать статью и контентную сессию
        run: node .github/scripts/integrate-warranty-content.mjs

      - name: Удалить одноразовые служебные файлы
        run: rm -f .github/scripts/integrate-warranty-content.mjs .github/workflows/integrate-warranty-content.yml

      - name: Зафиксировать результат
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editorial-data.mjs config/content-governance.json reports/content-sessions/latest.json .github/scripts/integrate-warranty-content.mjs .github/workflows/integrate-warranty-content.yml
          git commit -m "Интегрировать статью о гарантийном ремонте"
          git push origin HEAD:${{ github.head_ref }}
