name: Temp fix documentation marker C-025

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-fix-doc-marker-c025.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/designer-infographic-exclusive-rights
          fetch-depth: 0
      - name: Fix canonical URL marker
        shell: bash
        run: |
          sed -i 's/41 канонический содержательный URL/41 канонических содержательных URL/' docs/current-production-state.md
          rm .github/workflows/temp-fix-doc-marker-c025.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить маркер документации C-025"
          git push origin HEAD:agent/designer-infographic-exclusive-rights
