name: Полицейский кластер — Wordstat по явному запуску

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordstat:
    environment: seo-api
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Проверить одну гипотезу Wordstat
        env:
          SEO_STATE_DIR: ${{ runner.temp }}/police-wordstat
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
        run: node scripts/seo-data-pipeline.mjs --mode=wordstat --hypothesis=C-006

      - name: Сохранить нормализованный отчёт
        uses: actions/upload-artifact@v4
        with:
          name: police-inactivity-wordstat
          path: ${{ runner.temp }}/police-wordstat/
          if-no-files-found: error
          retention-days: 14
