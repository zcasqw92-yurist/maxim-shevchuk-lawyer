name: Временно сократить SEO-title разбора

on:
  push:
    branches:
      - content/refund-non-rendered-service
    paths:
      - .github/workflows/patch-refund-title.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/refund-non-rendered-service
          fetch-depth: 0
      - name: Сократить SEO-title
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/refund-services-cluster-data.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const from = 'seoTitle: "Как вернуть деньги за неоказанную услугу: порядок действий"';
          const to = 'seoTitle: "Неоказанная услуга: как вернуть деньги"';
          if (!source.includes(from)) throw new Error('SEO title anchor not found');
          source = source.replace(from, to);
          fs.writeFileSync(path, source, 'utf8');
          NODE
      - name: Зафиксировать правку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/refund-services-cluster-data.mjs
          git commit -m "Сократить SEO-title разбора о неоказанной услуге"
          git push origin HEAD:content/refund-non-rendered-service
