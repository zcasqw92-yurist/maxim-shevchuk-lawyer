name: Проверка сайта

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_PRODUCTION: 'true'
      SITE_URL: 'https://yuristshevchuk.com'
      SITE_BASE_PATH: ''
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION }}
      SITE_ANALYTICS_ENABLED: 'true'
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
      YANDEX_METRICA_ID: '111050150'
      SITE_VIDEO_ENABLED: ${{ vars.SITE_VIDEO_ENABLED || 'false' }}
      SITE_VIDEO_TITLE: ${{ vars.SITE_VIDEO_TITLE }}
      SITE_VIDEO_DURATION: ${{ vars.SITE_VIDEO_DURATION }}
      SITE_VIDEO_POSTER: ${{ vars.SITE_VIDEO_POSTER }}
      SITE_VIDEO_WEBM: ${{ vars.SITE_VIDEO_WEBM }}
      SITE_VIDEO_MP4: ${{ vars.SITE_VIDEO_MP4 }}
      SITE_VIDEO_CAPTIONS: ${{ vars.SITE_VIDEO_CAPTIONS }}
      INDEXNOW_KEY: ci-indexnow-key
      CROSS_BROWSER_REQUIRED: 'true'
      # Проверяем весь PR относительно его базовой ветки, а не только последний коммит.
      CONTENT_GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить дату автоматической проверки
        run: echo "SITE_REVIEW_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить браузеры
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Выполнить полную production-проверку
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/live-all-publications-smoke.mjs
          npm run check 2>&1 | tee check.log

      - name: Проверить опубликованную карточку услуги в кейсах
        shell: bash
        env:
          SITE_CUSTOM_DOMAIN_URL: https://yuristshevchuk.com
          EXPECTED_BUILD_SHA: f85386c921a807cc617ec5a5c7b81ad075fe339a
          CUSTOM_DOMAIN_VERIFY_ATTEMPTS: '30'
          CUSTOM_DOMAIN_VERIFY_DELAY_MS: '10000'
        run: |
          node scripts/verify-custom-domain-sha.mjs
          node --input-type=module <<'NODE'
          const url = new URL('/assets/styles.css', process.env.SITE_CUSTOM_DOMAIN_URL);
          url.searchParams.set('case_service_card_check', `${process.env.EXPECTED_BUILD_SHA.slice(0, 12)}-${Date.now()}`);
          const response = await fetch(url, {
            headers: { 'cache-control': 'no-cache, no-store, max-age=0', pragma: 'no-cache' },
            cache: 'no-store',
            redirect: 'follow',
          });
          if (!response.ok) throw new Error(`styles.css returned ${response.status}`);
          const css = await response.text();
          const required = [
            '.case-page .editorial-case-aside > a[href^="/uslugi/"]',
            'content: "Услуга по теме"',
            'content: "Перейти к услуге  →"',
          ];
          for (const marker of required) {
            if (!css.includes(marker)) throw new Error(`Published styles are missing: ${marker}`);
          }
          console.log(`Published case service card verified in ${response.url}`);
          NODE

      - name: Сохранить диагностику при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-check-diagnostics-${{ github.run_id }}
          path: |
            check.log
            reports
            test-results
            *.log
          if-no-files-found: ignore
          retention-days: 7
