name: Patch refund service hub

on:
  push:
    branches:
      - content/refund-service-hub
    paths:
      - scripts/patch-refund-service-hub.py
      - .github/workflows/patch-refund-service-hub.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: content/refund-service-hub

      - name: Apply governed content patch
        run: python3 scripts/patch-refund-service-hub.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/service-content.mjs src/search-visibility.mjs site.config.mjs config/content-governance.json reports/content-sessions/template.json reports/content-sessions/latest.json package.json scripts/refund-service-hub-test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Усилить страницу возврата денег как центр кластера"
          git push origin HEAD:content/refund-service-hub
