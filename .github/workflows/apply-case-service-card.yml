name: Apply case service card

on:
  push:
    branches:
      - agent/style-case-service-link
    paths:
      - .github/workflows/apply-case-service-card.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply markup, styles and contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          render = Path('src/editorial-render.mjs')
          text = render.read_text(encoding='utf-8')
          import_anchor = 'import { formatContentDate } from "./content-dates.mjs";\n'
          if 'import { services } from "./data.mjs";' not in text:
              text = text.replace(import_anchor, import_anchor + 'import { services } from "./data.mjs";\n')

          map_anchor = 'const organizationId = `${rootUrl}/${site.organizationId}`;\n'
          if 'const serviceNameBySlug' not in text:
              text = text.replace(map_anchor, map_anchor + 'const serviceNameBySlug = new Map(services.map((item) => [item.slug, item.name]));\n')

          old = '<aside class="editorial-case-aside"><strong>Ограничения публикации</strong><p>Не раскрываются ФИО, адреса, номера материалов и иные идентификаторы. Описание не является обещанием аналогичного результата.</p><a href="/uslugi/${item.serviceSlug}/">Связанная услуга</a></aside>'
          new = '<aside class="editorial-case-aside"><strong>Ограничения публикации</strong><p>Не раскрываются ФИО, адреса, номера материалов и иные идентификаторы. Описание не является обещанием аналогичного результата.</p><a class="editorial-case-service-link" href="/uslugi/${item.serviceSlug}/"><span>Услуга по теме</span><strong>${esc(serviceNameBySlug.get(item.serviceSlug) || "Связанная услуга")}</strong><em>Перейти к услуге <span aria-hidden="true">→</span></em></a></aside>'
          if old in text:
              text = text.replace(old, new)
          elif 'class="editorial-case-service-link"' not in text:
              raise SystemExit('Case service markup anchor not found')
          render.write_text(text, encoding='utf-8')

          css = Path('src/editorial-publication.css')
          text = css.read_text(encoding='utf-8')
          marker = '  .article-page .editorial-related > p > a[href^="/uslugi/"]:focus-visible {\n    outline: 2px solid var(--gold-text);\n    outline-offset: 3px;\n  }\n'
          block = '''

  .case-page .editorial-case-service-link {
    display: grid;
    min-width: 0;
    gap: 7px;
    overflow: hidden;
    margin-top: 20px;
    padding: 20px;
    color: var(--ink-deep);
    border: 1px solid var(--border-accent-soft);
    background:
      linear-gradient(var(--gold), var(--gold)) 0 0 / 30% 3px no-repeat,
      linear-gradient(135deg, var(--surface-highlight), var(--surface-card));
    box-shadow: 0 12px 30px rgba(16, 40, 61, .06);
    text-decoration: none;
    transition: border-color .2s ease, background-size .24s ease, box-shadow .2s ease, transform .2s ease;
  }

  .case-page .editorial-case-service-link > span:first-child {
    color: var(--gold-text);
    font-family: var(--sans);
    font-size: .6875rem;
    font-weight: 800;
    letter-spacing: .1em;
    line-height: 1.3;
    text-transform: uppercase;
  }

  .case-page .editorial-case-service-link > strong {
    margin: 0;
    color: var(--ink-deep);
    font-family: var(--serif);
    font-size: clamp(1.08rem, 1.8vw, 1.28rem);
    font-weight: 500;
    letter-spacing: -.02em;
    line-height: 1.25;
    text-wrap: balance;
  }

  .case-page .editorial-case-service-link > em {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-top: 4px;
    color: var(--gold-text);
    font-family: var(--sans);
    font-size: .8125rem;
    font-style: normal;
    font-weight: 800;
    line-height: 1.4;
  }

  .case-page .editorial-case-service-link > em span {
    transition: transform .2s ease;
  }

  .case-page .editorial-case-service-link:hover,
  .case-page .editorial-case-service-link:focus-visible {
    color: var(--ink-deep);
    border-color: var(--gold);
    background-size: 100% 3px, 100% 100%;
    box-shadow: 0 17px 38px rgba(16, 40, 61, .11);
    transform: translateY(-2px);
  }

  .case-page .editorial-case-service-link:hover > em span,
  .case-page .editorial-case-service-link:focus-visible > em span {
    transform: translateX(4px);
  }

  .case-page .editorial-case-service-link:focus-visible {
    outline: 2px solid var(--gold-text);
    outline-offset: 3px;
  }
'''
          if '.case-page .editorial-case-service-link {' not in text:
              if marker not in text:
                  raise SystemExit('CSS insertion marker not found')
              text = text.replace(marker, marker + block)

          reduce_marker = '    .article-page .editorial-related > p > a[href^="/uslugi/"],\n    .article-page .editorial-related > p > a[href^="/uslugi/"]::after {\n      transition: none;\n    }\n'
          reduce_new = '    .article-page .editorial-related > p > a[href^="/uslugi/"],\n    .article-page .editorial-related > p > a[href^="/uslugi/"]::after,\n    .case-page .editorial-case-service-link,\n    .case-page .editorial-case-service-link > em span {\n      transition: none;\n    }\n'
          if '.case-page .editorial-case-service-link > em span {\n      transition: none;' not in text:
              if reduce_marker not in text:
                  raise SystemExit('Reduced motion marker not found')
              text = text.replace(reduce_marker, reduce_new)

          motion_marker = '    .editorial-page .editorial-related > p > a[href^="/uslugi/"]:hover,\n    .editorial-page .editorial-related > p > a[href^="/uslugi/"]:focus-visible {\n      transform: none;\n    }\n'
          motion_new = '    .editorial-page .editorial-related > p > a[href^="/uslugi/"]:hover,\n    .editorial-page .editorial-related > p > a[href^="/uslugi/"]:focus-visible,\n    .case-page .editorial-case-service-link:hover,\n    .case-page .editorial-case-service-link:focus-visible {\n      transform: none;\n    }\n'
          if '.case-page .editorial-case-service-link:focus-visible {\n      transform: none;' not in text:
              if motion_marker not in text:
                  raise SystemExit('Reduced motion transform marker not found')
              text = text.replace(motion_marker, motion_new)
          css.write_text(text, encoding='utf-8')

          test = Path('scripts/publication-linking-test.mjs')
          text = test.read_text(encoding='utf-8')
          anchor = '  if (!service || !hasHref(html, servicePath(service))) errors.push(`${item.slug}: отсутствует ссылка на связанную услугу`);\n'
          checks = '''  if (!html.includes('class="editorial-case-service-link"')) errors.push(`${item.slug}: связанная услуга не оформлена карточкой`);
  if (service && !html.includes(`<strong>${service.name}</strong>`)) errors.push(`${item.slug}: карточка услуги не показывает название направления ${service.name}`);
  if (!html.includes('Услуга по теме') || !html.includes('Перейти к услуге')) errors.push(`${item.slug}: карточка услуги не содержит понятных подписей перехода`);
'''
          if 'связанная услуга не оформлена карточкой' not in text:
              if anchor not in text:
                  raise SystemExit('Publication linking test anchor not found')
              text = text.replace(anchor, anchor + checks)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/editorial-render.mjs src/editorial-publication.css scripts/publication-linking-test.mjs
          git commit -m "Оформить связанную услугу в кейсах" || exit 0
          git push
