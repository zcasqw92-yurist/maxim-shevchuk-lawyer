name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    env:
      SITE_PRODUCTION: 'true'
      # Публичный адрес сайта после подключения custom domain в GitHub Pages.
      SITE_URL: 'https://yuristshevchuk.com'
      # На собственном домене сайт публикуется из корня, без имени репозитория.
      SITE_BASE_PATH: ''
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION }}
      # Метрика запускается на клиенте только после отдельного согласия посетителя.
      SITE_ANALYTICS_ENABLED: 'true'
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
      YANDEX_METRICA_ID: '111050150'
      SITE_VIDEO_ENABLED: ${{ vars.SITE_VIDEO_ENABLED || 'false' }}
      SITE_VIDEO_TITLE: ${{ vars.SITE_VIDEO_TITLE }}
      SITE_VIDEO_DURATION: ${{ vars.SITE_VIDEO_DURATION }}
      SITE_VIDEO_POSTER: ${{ vars.SITE_VIDEO_POSTER }}
      SITE_VIDEO_WEBM: ${{ vars.SITE_VIDEO_WEBM }}
      SITE_VIDEO_MP4: ${{ vars.SITE_VIDEO_MP4 }}
      SITE_VIDEO_CAPTIONS: ${{ vars.SITE_VIDEO_CAPTIONS }}
      INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build production site
        run: npm run build

      - name: Validate generated site
        env:
          CROSS_BROWSER_REQUIRED: 'true'
        run: npm run validate && npm run audit:seo && npm run test:deployment-observability && npm run test:performance-budget && npm run test:video-ready && npm run test:core-web-vitals && npm run test:cross-browser

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published build
        env:
          SITE_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: npm run test:live
