name: SEO data feedback

on:
  schedule:
    - cron: '25 4 * * 1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/seo-data-pipeline.yml'
      - 'config/seo-data-pipeline.json'
      - 'data/seo/wordstat-cache.json'
      - 'scripts/seo-data-pipeline.mjs'
      - 'scripts/seo-feedback-pipeline.mjs'
      - 'scripts/seo-feedback-enrichment.mjs'
      - 'scripts/seo-metrica-event-goals.mjs'
      - 'scripts/seo-feedback-summary.mjs'
      - 'scripts/seo-data-pipeline-test.mjs'
      - 'scripts/seo-feedback-enrichment-test.mjs'
      - 'scripts/seo-metrica-event-goals-test.mjs'
      - 'scripts/seo-workflow-runtime-test.mjs'
      - 'src/editorial-data.mjs'
      - 'src/metrica-goals.mjs'
      - 'public/assets/editorial-analytics.mjs'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Режим: feedback не расходует Wordstat; wordstat проверяет выбранную гипотезу'
        required: true
        default: feedback
        type: choice
        options:
          - feedback
          - wordstat
          - all
      hypothesis_id:
        description: 'Контент ID гипотезы, например C-001. Пусто — только ожидающие проверки.'
        required: false
        type: string
      force_wordstat:
        description: 'Игнорировать свежий кеш Wordstat'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: seo-data-feedback
  cancel-in-progress: false

jobs:
  collect:
    name: Collect normalized SEO feedback
    environment: seo-api
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      PIPELINE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'feedback' }}
      SEO_HYPOTHESIS_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.hypothesis_id || '' }}
      SEO_FORCE_WORDSTAT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_wordstat || 'false' }}
      YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
      YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
      YANDEX_METRICA_OAUTH_TOKEN: ${{ secrets.YANDEX_METRICA_OAUTH_TOKEN }}
      YANDEX_METRICA_ID: '111050150'
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SEARCH_CONSOLE_SERVICE_ACCOUNT_JSON_BASE64 }}
      GOOGLE_SEARCH_CONSOLE_SITE_URL: ${{ vars.GOOGLE_SEARCH_CONSOLE_SITE_URL }}

    steps:
      - name: Checkout pipeline code
        uses: actions/checkout@v6

      - name: Checkout persistent SEO state
        uses: actions/checkout@v6
        with:
          ref: seo-data
          path: .seo-state
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.17.0'
          package-manager-cache: false

      - name: Run contract tests
        run: |
          node scripts/seo-workflow-runtime-test.mjs
          node scripts/seo-data-pipeline-test.mjs
          node scripts/seo-feedback-enrichment-test.mjs
          node scripts/seo-metrica-event-goals-test.mjs

      - name: Collect full SEO feedback without Wordstat spending
        shell: bash
        run: |
          set -euo pipefail
          state_dir="${GITHUB_WORKSPACE}/.seo-state/reports/seo-data"
          wordstat_args=("--mode=wordstat")
          if [[ -n "${SEO_HYPOTHESIS_ID}" ]]; then
            wordstat_args+=("--hypothesis=${SEO_HYPOTHESIS_ID}")
          fi
          if [[ "${SEO_FORCE_WORDSTAT}" == "true" ]]; then
            wordstat_args+=("--force=true")
          fi

          case "${PIPELINE_MODE}" in
            feedback)
              SEO_STATE_DIR="${state_dir}" node scripts/seo-feedback-pipeline.mjs
              SEO_STATE_DIR="${state_dir}" node scripts/seo-feedback-enrichment.mjs
              SEO_STATE_DIR="${state_dir}" node scripts/seo-metrica-event-goals.mjs
              ;;
            wordstat)
              SEO_STATE_DIR="${state_dir}" node scripts/seo-data-pipeline.mjs "${wordstat_args[@]}"
              ;;
            all)
              SEO_STATE_DIR="${state_dir}" node scripts/seo-feedback-pipeline.mjs
              SEO_STATE_DIR="${state_dir}" node scripts/seo-feedback-enrichment.mjs
              SEO_STATE_DIR="${state_dir}" node scripts/seo-metrica-event-goals.mjs
              SEO_STATE_DIR="${state_dir}" node scripts/seo-data-pipeline.mjs "${wordstat_args[@]}"
              ;;
            *)
              echo "Unknown PIPELINE_MODE=${PIPELINE_MODE}" >&2
              exit 1
              ;;
          esac

          if [[ "${PIPELINE_MODE}" == "feedback" || "${PIPELINE_MODE}" == "all" ]]; then
            SEO_STATE_DIR="${state_dir}" node scripts/seo-feedback-summary.mjs
          fi

      - name: Save normalized state to seo-data branch
        shell: bash
        working-directory: .seo-state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/seo-data
          if git diff --cached --quiet; then
            echo "SEO state has not changed"
            exit 0
          fi
          git commit -m "Обновить SEO-статистику ${GITHUB_RUN_ID}"
          git push origin HEAD:seo-data

      - name: Upload sheet-ready reports
        uses: actions/upload-artifact@v7
        with:
          name: seo-data-${{ github.run_id }}
          path: .seo-state/reports/seo-data
          if-no-files-found: error
          retention-days: 90

      - name: Write summary
        shell: bash
        run: |
          if [[ -f .seo-state/reports/seo-data/summary.md ]]; then
            cat .seo-state/reports/seo-data/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# SEO data pipeline" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Mode: ${PIPELINE_MODE}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Wordstat is protected by a 30-day cache and a 1+2 call limit." >> "$GITHUB_STEP_SUMMARY"
          fi
