name: Temp fix practical type C-025

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-fix-practical-type.yml

permissions:
  contents: write

jobs:
  patch-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/designer-infographic-exclusive-rights
          fetch-depth: 0
      - name: Use supported practical element type
        shell: bash
        run: |
          sed -i 's/"type":"evidence-chain"/"type":"evidence-matrix"/' reports/content-sessions/latest.json
          rm .github/workflows/temp-fix-practical-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Исправить тип практического блока C-025"
          git push origin HEAD:agent/designer-infographic-exclusive-rights
