name: Исправить SEO-описание статьи о двигателе

on:
  push:
    branches:
      - agent/contract-engine-no-receipt-article
    paths:
      - .github/workflows/fix-contract-engine-description.yml

permissions:
  contents: write

jobs:
  fix-description:
    runs-on: ubuntu-latest
    steps:
      - name: Получить ветку
        uses: actions/checkout@v4
        with:
          ref: agent/contract-engine-no-receipt-article
          fetch-depth: 0

      - name: Сократить SEO-описание
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/contract-engine-no-receipt-data.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'Что делать, если за контрактный двигатель заплатили наличными и переводами, расписки нет, а мотор не привезли: как собрать доказательства, подать заявление и сохранить гражданский иск.'
          new = 'Что делать, если за контрактный двигатель заплатили наличными и переводами, расписки нет, а мотор не привезли: доказательства, заявление и возврат денег.'
          if old not in text:
              raise SystemExit('Исходное SEO-описание не найдено')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Зафиксировать изменение
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contract-engine-no-receipt-data.mjs
          git commit -m "Сократить SEO-описание статьи о двигателе"
          git push origin HEAD:agent/contract-engine-no-receipt-article
