        with:
          ref: agent/designer-infographic-exclusive-rights
          fetch-depth: 0
      - name: Register article and content session
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          
          site_path = Path("site.config.mjs")
          site = site_path.read_text(encoding="utf-8")
          anchor = '    "/razbory/pristav-perechislyaet-malo-s-pensii-dolzhnika": "2026-08-05",\n'
          addition = '    "/razbory/dogovor-s-dizaynerom-peredacha-prav-na-infografiku": "2026-08-05",\n'
          if addition not in site:
              if anchor not in site:
                  raise SystemExit("site.config anchor not found")
              site = site.replace(anchor, anchor + addition)
          site_path.write_text(site, encoding="utf-8")
          
          config_path = Path("config/content-experiment-exceptions.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
