name: Добавить дату новой статьи

on:
  push:
    branches:
      - content/police-no-response-20260801
    paths:
      - .github/workflows/add-police-content-date-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/police-no-response-20260801

      - name: Добавить дату и запись в manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const configPath = 'site.config.mjs';
          let config = fs.readFileSync(configPath, 'utf8');
          const line = '    "/razbory/politsiya-ne-otvechaet-na-zayavlenie": "2026-08-01",';
          if (!config.includes(line)) {
            config = config.replace(
              '    "/razbory/chto-delat-posle-otkaza-policii": "2026-07-28",',
              '    "/razbory/chto-delat-posle-otkaza-policii": "2026-07-28",\n' + line,
            );
          }
          fs.writeFileSync(configPath, config);

          const manifestPath = 'reports/content-sessions/latest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!manifest.contentChanges.some((item) => item.path === 'site.config.mjs')) {
            manifest.contentChanges.push({
              path: 'site.config.mjs',
              kind: 'content-date',
              contentId: 'police-no-response',
              action: 'updated',
              expectedUrl: 'https://yuristshevchuk.com/razbory/politsiya-ne-otvechaet-na-zayavlenie/',
            });
          }
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Удалить workflow и зафиксировать изменение
        run: |
          rm .github/workflows/add-police-content-date-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site.config.mjs reports/content-sessions/latest.json .github/workflows/add-police-content-date-once.yml
          git commit -m 'Добавить дату статьи о бездействии полиции'
          git push origin HEAD:content/police-no-response-20260801
