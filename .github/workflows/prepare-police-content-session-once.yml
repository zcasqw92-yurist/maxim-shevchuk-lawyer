                  },
                ],
                pageTypeDecision: 'article',
                decisionReason: 'Преобладает самостоятельная информационная потребность. Wordstat подтвердил точную разговорную формулировку с частотностью 29 по Москве; отдельный запрос про «проверка ведётся» дал смешанную выдачу и остаётся разделом этой статьи.',
                canProvideBetterAnswer: true,
              },
            ],
            practicalElements: [
              {
                contentId: 'police-no-response',
                targetUrl: 'https://yuristshevchuk.com/razbory/politsiya-ne-otvechaet-na-zayavlenie/',
                type: 'procedure-timeline',
                title: 'Карта проверки: заявление → КУСП → срок → решение → жалоба',
                userValue: 'Позволяет определить последнюю подтверждённую стадию и запросить конкретный документ вместо повторных общих обращений.',
                competitorGap: 'Большинство изученных страниц смешивает разные нарушения и не показывает, как связать регистрацию, сроки 3/10/30 суток и одно из решений статьи 145 УПК РФ.',
                sourceBasis: 'реальное обращение, дословная реплика клиента, подтверждённые паттерны аудитории, оплаченная юридическая работа и актуальные нормы УПК РФ',
                sourceIds: ['C-006', 'R-0010', 'P-004', 'P-005', 'K-001', 'ЮД-20260724-001'],
                placement: 'раздел «Карта проверки: на каком этапе возникла проблема» и связанные разделы о сроках, решениях и адресной жалобе',
                verifiedAgainstSerp: true,
              },
            ],
            cannibalizationChecked: true,
            overOptimizationRisk: 'low',
          };
          manifest.editorialChecks = {
            factsSeparatedFromHypotheses: true,
            paidWorkSeparatedFromPaymentDetails: true,
            workProcedureAndCaseResultsSeparated: true,
            legalSourcesVerified: true,
            anonymizationVerified: true,
            criticalSourceErrorsResolved: true,
          };
          manifest.contentChanges = [
            {
              path: 'src/police-inactivity-cluster-data.mjs',
              kind: 'article',
              contentId: 'police-no-response',
              action: 'created',
              expectedUrl: 'https://yuristshevchuk.com/razbory/politsiya-ne-otvechaet-na-zayavlenie/',
            },
            {
              path: 'src/editorial-data.mjs',
              kind: 'article-registry',
              contentId: 'police-no-response',
              action: 'updated',
              expectedUrl: 'https://yuristshevchuk.com/razbory/politsiya-ne-otvechaet-na-zayavlenie/',
            },
          ];
          manifest.plannedChecks = [
            'npm run test:public-copy',
            'npm run check',
            'npm run test:live',
            'node scripts/live-all-publications-smoke.mjs',
            'node scripts/live-public-copy-regression-test.mjs',
          ];
          manifest.publication = {
            expectedUrls: ['https://yuristshevchuk.com/razbory/politsiya-ne-otvechaet-na-zayavlenie/'],
            notes: 'Публикуется одна статья-владелец. K-001 остаётся непубличным: выполненная работа подтверждена, но окончательный результат дела отсутствует.',
          };
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const configPath = 'config/content-governance.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          if (!config.governedContentPaths.includes('src/police-inactivity-cluster-data.mjs')) {
            const index = config.governedContentPaths.indexOf('src/refund-services-cluster-data.mjs');
            config.governedContentPaths.splice(index + 1, 0, 'src/police-inactivity-cluster-data.mjs');
          }
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Удалить одноразовый workflow и зафиксировать сессию
        run: |
          rm .github/workflows/prepare-police-content-session-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/content-sessions/latest.json config/content-governance.json .github/workflows/prepare-police-content-session-once.yml
          git commit -m 'Зафиксировать контентную сессию полицейского кластера'
          git push origin HEAD:content/police-no-response-20260801
