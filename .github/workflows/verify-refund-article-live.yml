name: Независимо проверить статью на основном домене

on:
  push:
    branches:
      - fix/button-analytics-consent-navigation
    paths:
      - .github/workflows/verify-refund-article-live.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Проверить SHA и статью
        id: verify
        continue-on-error: true
        env:
          EXPECTED_SHA: 12f38959cbb1c076113690d3d535690a1eaebad7
          SITE_URL: https://yuristshevchuk.com
          ARTICLE_PATH: /razbory/vernut-dengi-za-neokazannuyu-uslugu/
        run: |
          set +e
          : > live-attempts.log
          success=false
          build_status=0
          article_status=0
          received_sha=""
          h1=false
          canonical=false
          matrix=false
          faq=false
          article_jsonld=false
          attempts=0

          for attempt in $(seq 1 30); do
            attempts="$attempt"
            nonce="$(date +%s)-$attempt"
            rm -f build-info.json article.html

            build_status=$(curl -sS -L --max-time 15 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -o build-info.json -w '%{http_code}' \
              "$SITE_URL/build-info.json?nonce=$nonce")
            build_exit=$?

            article_status=$(curl -sS -L --max-time 15 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -o article.html -w '%{http_code}' \
              "$SITE_URL$ARTICLE_PATH?nonce=$nonce")
            article_exit=$?

            received_sha=$(node -e "try{const x=require('./build-info.json');process.stdout.write(String(x.sha||x.buildSha||''))}catch{}")
            grep -Fq 'Как вернуть деньги за неоказанную услугу' article.html 2>/dev/null && h1=true || h1=false
            grep -Eq 'rel="canonical"[^>]*href="https://yuristshevchuk.com/razbory/vernut-dengi-za-neokazannuyu-uslugu/"|href="https://yuristshevchuk.com/razbory/vernut-dengi-za-neokazannuyu-uslugu/"[^>]*rel="canonical"' article.html 2>/dev/null && canonical=true || canonical=false
            grep -Fq 'Сначала определите, что произошло с услугой' article.html 2>/dev/null && matrix=true || matrix=false
            grep -Fq 'Можно ли вернуть всю сумму, если услуга оказана частично?' article.html 2>/dev/null && faq=true || faq=false
            grep -Eq '"@type"[[:space:]]*:[[:space:]]*"Article"' article.html 2>/dev/null && article_jsonld=true || article_jsonld=false

            echo "attempt=$attempt build_exit=$build_exit build_status=$build_status article_exit=$article_exit article_status=$article_status sha=$received_sha h1=$h1 canonical=$canonical matrix=$matrix faq=$faq article_jsonld=$article_jsonld" | tee -a live-attempts.log

            if [ "$build_status" = "200" ] && [ "$article_status" = "200" ] && \
               [ "$received_sha" = "$EXPECTED_SHA" ] && [ "$h1" = "true" ] && \
               [ "$canonical" = "true" ] && [ "$matrix" = "true" ] && \
               [ "$faq" = "true" ] && [ "$article_jsonld" = "true" ]; then
              success=true
              break
            fi
            sleep 10
          done

          cat > live-verification.env <<EOF
          success=$success
          expected_sha=$EXPECTED_SHA
          received_sha=$received_sha
          build_status=$build_status
          article_status=$article_status
          h1=$h1
          canonical=$canonical
          matrix=$matrix
          faq=$faq
          article_jsonld=$article_jsonld
          attempts=$attempts
          EOF

          [ "$success" = "true" ]

      - name: Оставить результат в PR 93
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const values = {};
            try {
              for (const line of fs.readFileSync('live-verification.env', 'utf8').split(/\r?\n/)) {
                const index = line.indexOf('=');
                if (index > 0) values[line.slice(0, index)] = line.slice(index + 1);
              }
            } catch {}
            const ok = values.success === 'true';
            const body = [
              '## Независимая live-проверка статьи',
              '',
              `Результат: **${ok ? 'успешно' : 'ошибка'}**`,
              `Ожидаемый SHA: \`${values.expected_sha || 'не записан'}\``,
              `Полученный SHA: \`${values.received_sha || 'не получен'}\``,
              `build-info HTTP: **${values.build_status || 'нет'}**`,
              `Статья HTTP: **${values.article_status || 'нет'}**`,
              `H1: **${values.h1 === 'true' ? 'да' : 'нет'}**`,
              `canonical: **${values.canonical === 'true' ? 'да' : 'нет'}**`,
              `практическая матрица: **${values.matrix === 'true' ? 'да' : 'нет'}**`,
              `FAQ: **${values.faq === 'true' ? 'да' : 'нет'}**`,
              `Article JSON-LD: **${values.article_jsonld === 'true' ? 'да' : 'нет'}**`,
              '',
              `Попыток: **${values.attempts || 0}**`,
              '',
              '> Проверка не вызывает Yandex Search API, Wordstat или SerpApi.',
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 93, body });

      - name: Завершить с правильным статусом
        if: always()
        run: |
          test -f live-verification.env
          grep -q '^success=true$' live-verification.env
