name: Fix C-016 publication date

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/c016-publication-date-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    name: Correct article publication date
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correct source date and content-session timestamp
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          article_path = Path('src/unpaid-services-without-contract-data.mjs')
          text = article_path.read_text(encoding='utf-8')
          old = '    publishedAt: "2026-08-02",\n    modifiedAt: "2026-08-02",\n    legalReviewedAt: "2026-08-02",'
          new = '    publishedAt: "2026-08-03",\n    modifiedAt: "2026-08-03",\n    legalReviewedAt: "2026-08-02",'
          if old not in text:
              raise SystemExit('Expected C-016 date block was not found')
          article_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          manifest_path = Path('reports/content-sessions/latest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['reviewedAt'] = '2026-08-03T01:20:00+03:00'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/c016-publication-date-fix.yml
          git add src/unpaid-services-without-contract-data.mjs reports/content-sessions/latest.json
          git commit -m "Исправить дату публикации C-016"
          git push
