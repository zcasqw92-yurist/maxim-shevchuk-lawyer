name: Унификация брендовых цветов (разовая)

on:
  push:
    branches:
      - design/brand-color-system

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ввести токены и убрать локальные цвета
        run: python scripts/brand-color-fix-once.py
      - name: Сохранить системное исправление
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Унифицировать фирменную палитру сайта"
          git push
