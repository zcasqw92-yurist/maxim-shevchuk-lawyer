name: Live-проверка статьи о гарантийном ремонте

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'verify/warranty-live-311f0b5'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Проверить основной домен, статью и прежние публикации
        run: node .github/scripts/verify-warranty-live.mjs
