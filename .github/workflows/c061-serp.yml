name: C-061 Google Programmable reserve

on:
  pull_request:
    branches: [main]
    paths:
      - 'config/c061-serp.json'
      - 'scripts/c061-google-programmable-serp.mjs'
      - '.github/workflows/c061-serp.yml'

permissions:
  contents: read

jobs:
  google-programmable:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout article branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Google Programmable Search results
        run: node scripts/c061-google-programmable-serp.mjs

      - name: Upload Google report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c061-google-programmable-serp
          path: reports/serp-snapshots/c061/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Google gate
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const google = JSON.parse(fs.readFileSync('reports/serp-snapshots/c061/google-programmable.json', 'utf8'));
          const g = google.queries?.[0];
          console.log(JSON.stringify({
            query: g?.query,
            googleOrganic: g?.organicResultsReviewed || 0,
            googleSponsored: g?.sponsoredResultsObserved || 0,
            googleStatus: g?.status || 'missing',
            googlePassed: Boolean(g?.minimumMet),
            source: google.source,
            limitation: google.sourceLimitations,
            diagnostics: g?.diagnostics || null
          }, null, 2));
          if (!g?.minimumMet) process.exit(1);
          NODE
