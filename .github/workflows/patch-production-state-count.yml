name: Временно обновить счётчик production-страниц

on:
  push:
    branches:
      - content/refund-non-rendered-service
    paths:
      - .github/workflows/patch-production-state-count.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/refund-non-rendered-service
          fetch-depth: 0
      - name: Обновить фактический состав сайта
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/current-production-state.md';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            ['Актуально на 30 июля 2026 года.', 'Актуально на 31 июля 2026 года.'],
            ['22 канонических содержательных URL: главная, каталог и семь страниц услуг, раздел и шесть юридических разборов, раздел и два полных кейса практики, страница о юристе, контакты и политика конфиденциальности;', '23 канонических содержательных URL: главная, каталог и семь страниц услуг, раздел и семь юридических разборов, раздел и два полных кейса практики, страница о юристе, контакты и политика конфиденциальности;'],
          ];
          for (const [from, to] of replacements) {
            if (!source.includes(from)) throw new Error(`Documentation anchor not found: ${from}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source, 'utf8');
          NODE
      - name: Зафиксировать правку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/current-production-state.md
          git commit -m "Обновить production-состав после нового разбора"
          git push origin HEAD:content/refund-non-rendered-service
