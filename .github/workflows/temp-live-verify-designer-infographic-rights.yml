name: Temp live verify designer infographic rights

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-live-verify-designer-infographic-rights.yml

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for expected SHA and verify live article
        shell: bash
        env:
          EXPECTED_SHA: c53acbc13457a6c8ac25a29926906a525d1b0ff3
          ARTICLE_URL: https://yuristshevchuk.com/razbory/dogovor-s-dizaynerom-peredacha-prav-na-infografiku/
        run: |
          set -euo pipefail
          found=''
          for attempt in $(seq 1 48); do
            curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://yuristshevchuk.com/build-info.json?nonce=$(date +%s)-${attempt}" \
              -o build-info.json || true
            if grep -Fq "$EXPECTED_SHA" build-info.json 2>/dev/null; then
              found='yes'
              break
            fi
            sleep 10
          done
          test "$found" = 'yes'
          grep -Fq '"articles": 25' build-info.json
          grep -Fq '"practiceCases": 2' build-info.json

          curl -fsSL --retry 3 --connect-timeout 10 --max-time 40 \
            -H 'Cache-Control: no-cache' \
            "${ARTICLE_URL}?nonce=$(date +%s)" \
            -o article.html
          grep -Fq 'Договор с дизайнером: как передать исключительные права на инфографику' article.html
          grep -Fq 'Как проверить цепочку прав на каждую инфографику' article.html
          grep -Fq 'https://yuristshevchuk.com/razbory/dogovor-s-dizaynerom-peredacha-prav-na-infografiku/' article.html
          grep -Fq 'index,follow' article.html
          grep -Fq "$EXPECTED_SHA" article.html
          echo 'LIVE_VERIFY_SUCCESS'
