name: C-016 SEO title fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/c016-seo-title-fix.yml'
      - 'scripts/c016-seo-title-fix.mjs'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - run: node scripts/c016-seo-title-fix.mjs
