name: Recover Pages infrastructure failure

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  actions: write
  contents: read

# Recovery не публикует сайт сам. Он может только повторить failed jobs
# исходного Pages run на том же SHA, и только если project code не запускался.
concurrency:
  group: pages-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-setup-only:
    name: Retry setup-only hosted runner failure
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Classify source failure and rerun failed jobs only when setup-only
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          attempt="$(jq -r '.workflow_run.run_attempt // 1' "$GITHUB_EVENT_PATH")"

          if (( attempt >= 3 )); then
            echo "Automatic recovery stopped: source run already reached attempt ${attempt}."
            exit 0
          fi

          jobs_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" \
            "${api}/actions/runs/${SOURCE_RUN_ID}/attempts/${attempt}/jobs?per_page=100")"

          failed_count="$(jq '[.jobs[] | select(.conclusion == "failure")] | length' <<<"${jobs_json}")"
          setup_only_count="$(jq '[.jobs[] | select(.conclusion == "failure") | select(
            ((.steps // []) | length) == 0 or
            (((.steps // []) | length) == 1 and .steps[0].name == "Set up job" and .steps[0].conclusion == "failure")
          )] | length' <<<"${jobs_json}")"

          if (( failed_count == 0 )); then
            echo "Recovery blocked: source run has no failed jobs to rerun."
            exit 0
          fi

          if (( failed_count != setup_only_count )); then
            echo "Recovery blocked: at least one failed job reached repository/deployment logic."
            jq -r '.jobs[] | select(.conclusion == "failure") | "- \(.name): " + (((.steps // []) | map(.name + "=" + (.conclusion // .status // "unknown"))) | join(", "))' <<<"${jobs_json}"
            exit 0
          fi

          echo "All ${failed_count} failed job(s) are setup-only. Re-running failed jobs for the same run/SHA."
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
            "${api}/actions/runs/${SOURCE_RUN_ID}/rerun-failed-jobs"
