name: One-off C-125 legal precision fix

on:
  push:
    branches: [fix/c125-accepted-work-crosslink]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/c125-accepted-work-crosslink
          fetch-depth: 0
      - name: Apply legal and linking corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          source_path = Path('src/house-construction-contractor-refund-data.mjs')
          source = source_path.read_text(encoding='utf-8')
          replacements = {
            '"Закупка материалов сама по себе не равна передаче результата заказчику. Важны принадлежность материалов, их индивидуализация, место хранения, документы о покупке и условия договора. Одновременно заказчику опасно игнорировать реально созданный и пригодный результат: необоснованное требование вернуть всю оплату ослабляет расчёт.",': '"Закупка материалов сама по себе не равна передаче результата заказчику. Важны принадлежность материалов, их индивидуализация, место хранения, документы о покупке и условия договора. При потребительском отказе из-за просрочки подрядчик не вправе требовать свои затраты или плату за выполненное, кроме работы, которую потребитель действительно принял. Поэтому сам по себе пригодный, но не принятый результат ещё не даёт подрядчику права удержать его стоимость.",',
            'text: "Проверяются объём, качество, проектное соответствие, актирование, оплата и возможность использовать результат дальше.",': 'text: "Проверяются объём, качество, проектное соответствие и главное — был ли этап действительно принят потребителем. Возможность использовать результат учитывается как доказательство, но сама по себе не заменяет принятие.",',
            'text: "Отделяются принятые и пригодные работы от обещаний, неподтверждённых закупок и не переданных материалов.",': 'text: "Отделяется работа, действительно принятая потребителем, от просто выполненного или пригодного результата, обещаний, неподтверждённых закупок и не переданных материалов.",',
            '"стоимость принятого и пригодного результата, если он есть;",': '"стоимость работы, которую потребитель действительно принял; для иных отношений последствия частичного выполнения проверяются отдельно;",',
            'answer: "Зафиксировать объём и качество, проверить проект, акты и пригодность свай для дальнейшей стройки. После этого рассчитывается, есть ли принятый результат и какую часть оплаты можно обоснованно требовать назад.",': 'answer: "Зафиксировать объём и качество, проверить проект и акты. При потребительском отказе из-за просрочки подрядчик может требовать плату только за работу, которую заказчик действительно принял; одна пригодность свай для дальнейшей стройки принятие не заменяет.",',
            'topic: "возврат оплаты за непостроенный частный дом после нарушения подрядчиком сроков",': 'topic: "возврат оплаты за непостроенный частный дом после нарушения подрядчиком сроков",\n    relatedArticleSlugs: ["zayavlenie-v-politsiyu-o-moshennichestve"],',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f'Missing source fragment: {old[:120]}')
              source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          linking_path = Path('src/publication-linking.mjs')
          linking = linking_path.read_text(encoding='utf-8')
          old = '''  const explicitArticles = kind === "case"
            ? (current.relatedArticleSlugs || []).map((slug) => articles.find((item) => item.slug === slug)).filter(Boolean)
            : [];'''
          new = '''  const explicitArticles = (current.relatedArticleSlugs || [])
            .map((slug) => articles.find((item) => item.slug === slug))
            .filter(Boolean);'''
          if old not in linking:
              raise SystemExit('Missing explicitArticles block')
          linking = linking.replace(old, new, 1)
          old = '''    for (const caseId of article.relatedCaseIds || []) {
              const linkedCase = caseMap.get(caseId);
              if (!linkedCase) errors.push(`Статья ${article.slug}: кейс ${caseId} не существует`);
              else if (linkedCase.serviceSlug !== article.serviceSlug) errors.push(`Статья ${article.slug}: кейс ${caseId} относится к другому направлению`);
            }
          }'''
          new = '''    for (const caseId of article.relatedCaseIds || []) {
              const linkedCase = caseMap.get(caseId);
              if (!linkedCase) errors.push(`Статья ${article.slug}: кейс ${caseId} не существует`);
              else if (linkedCase.serviceSlug !== article.serviceSlug) errors.push(`Статья ${article.slug}: кейс ${caseId} относится к другому направлению`);
            }
            for (const slug of article.relatedArticleSlugs || []) {
              if (slug === article.slug) errors.push(`Статья ${article.slug}: нельзя связать статью с самой собой`);
              else if (!articleMap.has(slug)) errors.push(`Статья ${article.slug}: связанный разбор ${slug} не существует`);
            }
          }'''
          if old not in linking:
              raise SystemExit('Missing article validation block')
          linking = linking.replace(old, new, 1)
          linking_path.write_text(linking, encoding='utf-8')

          test_path = Path('scripts/house-construction-contractor-refund-test.mjs')
          test = test_path.read_text(encoding='utf-8')
          anchor = 'if (!article.lead.includes("не просить подрядчика «расторгнуть договор»")) fail("lead lacks the refusal-versus-termination distinction");'
          addition = '''if (!article.lead.includes("не просить подрядчика «расторгнуть договор»")) fail("lead lacks the refusal-versus-termination distinction");
          if (!(article.relatedArticleSlugs || []).includes("zayavlenie-v-politsiyu-o-moshennichestve")) {
            fail("mandatory contextual link to the fraud-statement article is missing");
          }'''
          if anchor not in test:
              raise SystemExit('Missing test anchor')
          test = test.replace(anchor, addition, 1)
          anchor = 'if (!copy.includes("до их получения")) fail("fraud route lacks the initial-intent boundary");'
          addition = '''if (!copy.includes("до их получения")) fail("fraud route lacks the initial-intent boundary");
          if (!copy.includes("которую потребитель действительно принял")) {
            fail("consumer-delay refusal must distinguish accepted work from merely usable work");
          }
          if (!copy.includes("пригодный, но не принятый результат")) {
            fail("article must state that usability alone does not authorize withholding payment");
          }'''
          if anchor not in test:
              raise SystemExit('Missing legal precision test anchor')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test, encoding='utf-8')

          docs_path = Path('docs/PUBLICATION_LINKING.md')
          docs = docs_path.read_text(encoding='utf-8')
          docs = docs.replace(
              '- `relatedArticleSlugs` кейса могут указывать только на существующие статьи того же направления.',
              '- `relatedArticleSlugs` статьи или кейса могут указывать на существующие разборы, когда нужна явная контекстная связь; у кейса связь остаётся в пределах его направления.'
          )
          docs_path.write_text(docs, encoding='utf-8')

          manifest_path = Path('reports/content-sessions/latest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['sessionId'] = '20260805-2358-c125-accepted-work-crosslink'
          manifest['reviewedAt'] = '2026-08-05T21:58:00.000Z'
          manifest['sourceTrace']['notes'] += ' Follow-up legal review clarified Article 28(4): usability alone is not acceptance.'
          manifest['editorialChecks']['legalSourcesVerified'] = True
          manifest['contentChanges'] = [
              {"path":"src/house-construction-contractor-refund-data.mjs","kind":"article-legal-clarification","contentId":"house-construction-contractor-refund","action":"updated","expectedUrl":"https://yuristshevchuk.com/razbory/podryadchik-ne-postroil-dom-posle-oplaty/"},
              {"path":"src/publication-linking.mjs","kind":"contextual-linking","contentId":"house-construction-contractor-refund","action":"updated","expectedUrl":"https://yuristshevchuk.com/razbory/podryadchik-ne-postroil-dom-posle-oplaty/"},
              {"path":"scripts/house-construction-contractor-refund-test.mjs","kind":"publication-contract","contentId":"house-construction-contractor-refund","action":"updated","expectedUrl":"https://yuristshevchuk.com/razbory/podryadchik-ne-postroil-dom-posle-oplaty/"}
          ]
          manifest['publication']['notes'] = 'Follow-up legal precision review completed before final live acceptance. Article 28(4) distinction and mandatory contextual police-article link are now contract-tested.'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -f .github/c125-accepted-work-trigger.txt
          git rm .github/workflows/c125-accepted-work-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/house-construction-contractor-refund-data.mjs src/publication-linking.mjs scripts/house-construction-contractor-refund-test.mjs docs/PUBLICATION_LINKING.md reports/content-sessions/latest.json
          git commit -m "Уточнить принятие частичной работы и обязательную ссылку C-125"
          git push origin HEAD:fix/c125-accepted-work-crosslink
