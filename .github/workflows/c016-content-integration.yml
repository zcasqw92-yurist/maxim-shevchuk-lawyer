name: C-016 content integration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/c016-content-integration.yml'
      - 'scripts/c016-content-integration.mjs'
      - 'src/unpaid-services-without-contract-data.mjs'
      - 'reports/cluster-research/unpaid-services-without-contract.md'

permissions:
  contents: write

jobs:
  integrate:
    name: Register article and remove temporary integration files
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Apply integration and push commit
        run: node scripts/c016-content-integration.mjs
