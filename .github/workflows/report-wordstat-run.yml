name: Проверить Wordstat-запуск

on:
  push:
    branches:
      - research/police-inactivity-cluster-20260801
    paths:
      - .github/workflows/report-wordstat-run.yml

permissions:
  actions: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Найти последний запуск Wordstat и записать в PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo });
            const workflow = workflows.data.workflows.find((item) => item.path.endsWith('/police-wordstat-auto.yml'));
            if (!workflow) throw new Error('Wordstat workflow not found');
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflow.id,
              branch: 'research/police-inactivity-cluster-20260801',
              per_page: 10,
            });
            const lines = runs.data.workflow_runs.map((run) =>
              `- run ${run.id}: event=${run.event}; status=${run.status}; conclusion=${run.conclusion || '—'}; sha=${run.head_sha}`
            );
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 115,
              body: ['## Состояние Wordstat-запусков', '', ...lines].join('\n'),
            });
