name: Полицейский кластер — контрольный SERP-снимок

on:
  push:
    branches:
      - research/police-inactivity-cluster-20260801
    paths:
      - config/refund-services-serp.json
      - .github/workflows/police-serp-auto.yml

permissions:
  contents: write

concurrency:
  group: police-inactivity-serp
  cancel-in-progress: false

jobs:
  snapshot:
    environment: seo-api
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Снять Яндекс SERP
        env:
          SERP_ENGINE: yandex
          SERP_ALLOW_PAID_REQUESTS: '1'
          SERP_FORCE_REFRESH: '0'
          SERP_QUERY_IDS: 'police-inactivity-commercial,police-no-response,police-review-ongoing'
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
        run: node scripts/run-serp-budgeted.mjs

      - name: Снять Google SERP
        env:
          SERP_ENGINE: google
          SERP_ALLOW_PAID_REQUESTS: '1'
          SERP_FORCE_REFRESH: '0'
          SERP_QUERY_IDS: 'police-inactivity-commercial,police-no-response,police-review-ongoing'
          SERPER_API_KEY: ''
          SERPAPI_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: node scripts/run-serp-budgeted.mjs

      - name: Показать итог шлюза
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const engine of ['yandex', 'google']) {
            const report = JSON.parse(fs.readFileSync(`reports/serp-snapshots/refund-services/${engine}-api.json`, 'utf8'));
            console.log(`\n${engine.toUpperCase()} gate=${report.gatePassed}; paid=${report.cachePolicy?.paidRequestsThisRun ?? 0}`);
            for (const item of report.queries || []) {
              console.log(`${item.id}: organic=${item.organicResultsReviewed ?? 0}; sponsored=${item.sponsoredResultsObserved ?? 0}; minimum=${item.minimumMet}`);
              for (const result of (item.organicResults || []).slice(0, 10)) {
                console.log(`  - ${result.domain || ''} | ${result.title || ''}`);
              }
            }
          }
          NODE

      - name: Зафиксировать кеш и расход
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/serp-cache/refund-services.json reports/serp-usage/api-usage.json
          if git diff --cached --quiet; then
            echo 'Кеш и журнал расхода не изменились.'
          else
            git commit -m 'Сохранить SERP-снимок полицейского кластера [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Сохранить отчёты
        uses: actions/upload-artifact@v4
        with:
          name: police-inactivity-serp-snapshot
          path: reports/serp-snapshots/refund-services/
          if-no-files-found: error
          retention-days: 14
