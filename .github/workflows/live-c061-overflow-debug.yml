name: Диагностика C-061 WebKit overflow

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/live-c061-overflow-diagnostic.mjs
      - .github/workflows/live-c061-overflow-debug.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить WebKit
        run: npx playwright install --with-deps webkit

      - name: Найти источник горизонтального переполнения C-061
        run: node scripts/live-c061-overflow-diagnostic.mjs
