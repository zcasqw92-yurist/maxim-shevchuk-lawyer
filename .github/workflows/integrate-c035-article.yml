name: Integrate C-035 article

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-c035-article.yml'
      - 'scripts/integrate-c035-article.mjs'
      - 'src/autoservice-paint-defects-data.mjs'
      - 'reports/cluster-research/autoservice-paint-defects.md'

permissions:
  contents: write

env:
  NODE_VERSION: '22.17.0'

jobs:
  integrate:
    name: Integrate, validate and commit article
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SITE_PRODUCTION: 'true'
      SITE_URL: 'https://yuristshevchuk.com'
      SITE_BASE_PATH: ''
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION }}
      SITE_ANALYTICS_ENABLED: 'true'
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
      YANDEX_METRICA_ID: '111050150'
      SITE_VIDEO_ENABLED: ${{ vars.SITE_VIDEO_ENABLED || 'false' }}
      SITE_VIDEO_TITLE: ${{ vars.SITE_VIDEO_TITLE }}
      SITE_VIDEO_DURATION: ${{ vars.SITE_VIDEO_DURATION }}
      SITE_VIDEO_POSTER: ${{ vars.SITE_VIDEO_POSTER }}
      SITE_VIDEO_WEBM: ${{ vars.SITE_VIDEO_WEBM }}
      SITE_VIDEO_MP4: ${{ vars.SITE_VIDEO_MP4 }}
      SITE_VIDEO_CAPTIONS: ${{ vars.SITE_VIDEO_CAPTIONS }}
      INDEXNOW_KEY: ci-indexnow-key
      CROSS_BROWSER_REQUIRED: 'true'
      CONTENT_GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout article branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set review date
        run: echo "SITE_REVIEW_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Align research data and public wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          integration_path = Path('scripts/integrate-c035-article.mjs')
          integration = integration_path.read_text(encoding='utf-8')
          old_intent = 'intent: "действия после некачественной покраски автомобиля в автосервисе",'
          new_intent = 'intent: "зафиксировать плохую покраску автомобиля до переделки, выбрать требование и направить претензию обычному платному автосервису",'
          if old_intent not in integration:
              raise SystemExit('SERP intent marker not found')
          integration_path.write_text(integration.replace(old_intent, new_intent), encoding='utf-8')

          article_path = Path('src/autoservice-paint-defects-data.mjs')
          article = article_path.read_text(encoding='utf-8')
          old_paragraph = 'Также проверяется статус исполнителя. Если ремонт для личных нужд выполняла организация или предприниматель, обычно применяется Закон о защите прав потребителей. Если это разовая договорённость с обычным гражданином, правовой маршрут и состав требований могут быть другими. Само перечисление денег на личную карту этот вопрос не решает.'
          new_paragraph = 'Важно понять, кто фактически принял заказ. Если автомобиль для личных нужд ремонтировала компания или предприниматель, спор обычно рассматривается по Закону о защите прав потребителей. Когда работу разово выполнял частный мастер от своего имени, основания и требования нужно определять отдельно. Перевод на личную карту сам по себе не показывает, с кем был заключён договор.'
          if old_paragraph not in article:
              raise SystemExit('Public-copy paragraph marker not found')
          article_path.write_text(article.replace(old_paragraph, new_paragraph), encoding='utf-8')
          PY

      - name: Integrate article into governed files
        run: node scripts/integrate-c035-article.mjs

      - name: Run full publication contract
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/live-all-publications-smoke.mjs
          npm run check 2>&1 | tee check.log

      - name: Commit verified content changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Интегрировать разбор о плохой покраске автомобиля"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
