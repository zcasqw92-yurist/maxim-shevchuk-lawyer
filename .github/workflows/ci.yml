name: Проверка сайта

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_PRODUCTION: 'true'
      SITE_URL: 'https://yuristshevchuk.com'
      SITE_BASE_PATH: ''
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION }}
      SITE_ANALYTICS_ENABLED: 'true'
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
      YANDEX_METRICA_ID: '111050150'
      SITE_VIDEO_ENABLED: ${{ vars.SITE_VIDEO_ENABLED || 'false' }}
      SITE_VIDEO_TITLE: ${{ vars.SITE_VIDEO_TITLE }}
      SITE_VIDEO_DURATION: ${{ vars.SITE_VIDEO_DURATION }}
      SITE_VIDEO_POSTER: ${{ vars.SITE_VIDEO_POSTER }}
      SITE_VIDEO_WEBM: ${{ vars.SITE_VIDEO_WEBM }}
      SITE_VIDEO_MP4: ${{ vars.SITE_VIDEO_MP4 }}
      SITE_VIDEO_CAPTIONS: ${{ vars.SITE_VIDEO_CAPTIONS }}
      INDEXNOW_KEY: ci-indexnow-key
      CROSS_BROWSER_REQUIRED: 'true'

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить дату автоматической проверки
        run: echo "SITE_REVIEW_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить браузеры
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Выполнить полную production-проверку
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/live-all-publications-smoke.mjs
          npm run check 2>&1 | tee check.log

      - name: Сохранить диагностику при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-check-diagnostics-${{ github.run_id }}
          path: |
            check.log
            reports
            test-results
            *.log
          if-no-files-found: ignore
          retention-days: 7

  metrica-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'analytics/metrica-goal-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YANDEX_METRICA_ID: '111050150'
      YANDEX_METRICA_OAUTH_TOKEN: ${{ secrets.YANDEX_METRICA_OAUTH_TOKEN }}

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Провести аудит счётчика без изменений
        shell: bash
        run: |
          set -o pipefail
          node scripts/metrica-management-audit.mjs 2>&1 | tee metrica-audit.log

      - name: Сохранить снимок целей
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrica-audit-${{ github.run_id }}
          path: |
            reports/metrica-audit.json
            reports/metrica-audit.md
            metrica-audit.log
          if-no-files-found: warn
          retention-days: 7

  metrica-sync:
    if: github.event_name == 'pull_request' && github.head_ref == 'analytics/metrica-goal-audit' && needs.check.result == 'success' && needs.metrica-audit.result == 'success'
    needs:
      - check
      - metrica-audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YANDEX_METRICA_ID: '111050150'
      YANDEX_METRICA_OAUTH_TOKEN: ${{ secrets.YANDEX_METRICA_OAUTH_TOKEN }}

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'

      - name: Синхронизировать цели и воронки
        shell: bash
        run: |
          set -o pipefail
          node scripts/metrica-goal-sync.mjs 2>&1 | tee metrica-sync.log

      - name: Сохранить снимки до и после
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrica-sync-${{ github.run_id }}
          path: |
            reports/metrica-sync.json
            reports/metrica-sync.md
            metrica-sync.log
          if-no-files-found: warn
          retention-days: 14
