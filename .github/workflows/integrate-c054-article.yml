name: Integrate C-054 article

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-c054-article.yml'
      - 'scripts/integrate-c054-article.mjs'
      - 'src/judicial-order-after-writeoff-data.mjs'
      - 'reports/cluster-research/judicial-order-after-writeoff.md'

permissions:
  contents: write

env:
  NODE_VERSION: '22.17.0'

jobs:
  integrate:
    name: Integrate, validate and commit article
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SITE_PRODUCTION: 'true'
      SITE_URL: 'https://yuristshevchuk.com'
      SITE_BASE_PATH: ''
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION }}
      SITE_ANALYTICS_ENABLED: 'true'
      GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
      YANDEX_METRICA_ID: '111050150'
      SITE_VIDEO_ENABLED: ${{ vars.SITE_VIDEO_ENABLED || 'false' }}
      SITE_VIDEO_TITLE: ${{ vars.SITE_VIDEO_TITLE }}
      SITE_VIDEO_DURATION: ${{ vars.SITE_VIDEO_DURATION }}
      SITE_VIDEO_POSTER: ${{ vars.SITE_VIDEO_POSTER }}
      SITE_VIDEO_WEBM: ${{ vars.SITE_VIDEO_WEBM }}
      SITE_VIDEO_MP4: ${{ vars.SITE_VIDEO_MP4 }}
      SITE_VIDEO_CAPTIONS: ${{ vars.SITE_VIDEO_CAPTIONS }}
      INDEXNOW_KEY: ci-indexnow-key
      CROSS_BROWSER_REQUIRED: 'true'
      CONTENT_GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout article branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set review date
        run: echo "SITE_REVIEW_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Align governance data and public wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          integration_path = Path('scripts/integrate-c054-article.mjs')
          integration = integration_path.read_text(encoding='utf-8')
          old_type = 'type: "deadline-and-money-state-matrix",'
          new_type = 'type: "evidence-matrix",'
          if old_type not in integration:
              raise SystemExit('Practical element type marker not found')
          integration_path.write_text(integration.replace(old_type, new_type), encoding='utf-8')

          article_path = Path('src/judicial-order-after-writeoff-data.mjs')
          article = article_path.read_text(encoding='utf-8')
          old_paragraph = 'Если срок истёк, статья 129 ГПК РФ требует обосновать невозможность представить возражения вовремя по причинам, не зависящим от должника. Поэтому поздний документ должен включать не только несогласие, но и проверяемую хронологию с приложениями.'
          new_paragraph = 'Если десятидневный срок уже прошёл, объясните суду, почему вы не могли возразить раньше, и подтвердите это документами. Укажите, когда впервые узнали о приказе, что помешало получить его своевременно и как быстро обратились после обнаружения.'
          if old_paragraph not in article:
              raise SystemExit('Public-copy paragraph marker not found')
          article_path.write_text(article.replace(old_paragraph, new_paragraph), encoding='utf-8')
          PY

      - name: Integrate article into governed files
        run: node scripts/integrate-c054-article.mjs

      - name: Run full publication contract
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/live-all-publications-smoke.mjs
          npm run check 2>&1 | tee check.log

      - name: Commit verified content changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Интегрировать разбор об отмене приказа после списания"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
