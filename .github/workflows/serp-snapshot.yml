name: Слепок органической выдачи

on:
  push:
    branches:
      - 'agent/refund-services-serp-snapshot'
    paths:
      - 'config/refund-services-serp.json'
      - 'scripts/serp-snapshot.mjs'
      - 'scripts/yandex-public-serp.mjs'
      - '.github/workflows/serp-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  snapshot:
    environment: seo-api
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить Chromium
        run: npx playwright install --with-deps chromium

      - name: Снять публичную выдачу Яндекса
        id: yandex_public
        continue-on-error: true
        run: node scripts/yandex-public-serp.mjs

      - name: Проверить Search API и снять Google
        id: serp
        continue-on-error: true
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
        run: node scripts/serp-snapshot.mjs

      - name: Сохранить отчёт и диагностику
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refund-services-serp-snapshot
          path: reports/serp-snapshots/refund-services/
          if-no-files-found: warn
          retention-days: 14

      - name: Записать результат в pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const readJson = (path) => {
              try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
              catch (error) { core.warning(`${path} unavailable: ${error.message}`); return null; }
            };
            const report = readJson('reports/serp-snapshots/refund-services/latest.json');
            const yandexPublic = readJson('reports/serp-snapshots/refund-services/yandex-public.json');
            const yandexById = new Map((yandexPublic?.queries || []).map((item) => [item.id, item]));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/', '')}`;
            const { data: pulls } = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (!pulls.length) {
              core.warning(`No open pull request found for ${head}`);
              return;
            }

            const combinedGate = Boolean(
              report?.queries?.length &&
              report.queries.every((item) => yandexById.get(item.id)?.minimumMet && item.google?.minimumMet)
            );
            const lines = [
              '## Автоматический SERP-снимок',
              '',
              `Объединённый шлюз пройден: **${combinedGate ? 'да' : 'нет'}**`,
              '',
              '| Гипотеза | Яндекс: органика / реклама | Google: органика / реклама |',
              '|---|---:|---:|',
            ];

            for (const item of report?.queries || []) {
              const yandex = yandexById.get(item.id) || item.yandex || {};
              lines.push(`| ${item.query} | ${yandex.organicResultsReviewed ?? 0} / ${yandex.sponsoredResultsObserved ?? 0} (${yandex.status || 'нет'}) | ${item.google?.organicResultsReviewed ?? 0} / ${item.google?.sponsoredResultsObserved ?? 0} (${item.google?.status || 'нет'}) |`);
            }

            const errors = [];
            for (const item of report?.queries || []) {
              const yandex = yandexById.get(item.id) || item.yandex || {};
              if (yandex.status !== 'ok') errors.push(`Яндекс — ${item.query}: ${yandex.diagnostics?.reason || 'неизвестная ошибка'}`);
              if (item.google?.status !== 'ok') errors.push(`Google — ${item.query}: ${item.google?.diagnostics?.reason || 'неизвестная ошибка'}`);
            }
            if (errors.length) lines.push('', '### Диагностика', ...errors.slice(0, 12).map((value) => `- ${value}`));
            if (report?.queries?.some((item) => item.yandex?.status === 'error')) {
              lines.push('', 'Search API Яндекса оставлен в диагностике; для шлюза используется публичная выдача с отдельной классификацией рекламы.');
            }
            lines.push('', `Workflow commit: \`${context.sha}\``);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pulls[0].number,
              body: lines.join('\n'),
            });

      - name: Заблокировать неполный снимок
        if: steps.yandex_public.outcome != 'success' || steps.serp.outcome != 'success'
        run: exit 1
