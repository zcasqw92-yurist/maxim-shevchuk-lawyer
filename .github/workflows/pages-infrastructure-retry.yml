name: Retry Pages infrastructure failure

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: pages-infrastructure-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    name: Legacy retry disabled in favor of macOS fallback
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      false
    runs-on: macos-14
    timeout-minutes: 5
    steps:
      - name: Preserve setup-only retry contract without executing it
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          api="${GITHUB_API_URL}/repos/${REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          run_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/actions/runs/${RUN_ID}")"
          attempt="$(jq -r '.run_attempt // 1' <<<"${run_json}")"
          if (( attempt >= 3 )); then
            echo "Infrastructure retry limit reached: attempt ${attempt}."
            exit 0
          fi

          jobs_json="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100")"
          failed_count="$(jq '[.jobs[] | select(.conclusion == "failure")] | length' <<<"${jobs_json}")"
          setup_only_count="$(jq '[.jobs[] | select(.conclusion == "failure") | select((.steps | length) == 1 and .steps[0].name == "Set up job" and .steps[0].conclusion == "failure")] | length' <<<"${jobs_json}")"

          if (( failed_count == 0 || failed_count != setup_only_count )); then
            echo "No retry: the failure reached repository code or contained no failed job."
            exit 0
          fi

          echo "Legacy endpoint retained for contract compatibility; macOS fallback owns recovery."
          if false; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              "${auth[@]}" \
              "${api}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          fi
