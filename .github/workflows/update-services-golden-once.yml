name: Однократно обновить golden порядка услуг

on:
  push:
    branches:
      - seo/vzyskanie-dolga-cluster
    paths:
      - src/process-guarantees.mjs
      - .github/workflows/update-services-golden-once.yml

permissions:
  contents: write

jobs:
  update-golden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SITE_PRODUCTION: "true"
      SITE_URL: https://yuristshevchuk.com
      SITE_BASE_PATH: ""
      SITE_ANALYTICS_ENABLED: "true"
      YANDEX_METRICA_ID: "111050150"
      SITE_VIDEO_ENABLED: "false"
      INDEXNOW_KEY: ci-indexnow-key
    steps:
      - name: Получить ветку
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build

      - name: Обновить структурный эталон
        run: UPDATE_GOLDEN=1 npm run test:composition-contract

      - name: Зафиксировать обновлённый эталон
        shell: bash
        run: |
          if git diff --quiet -- tests/golden-render-contract.json; then
            echo "Golden-контракт уже актуален"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/golden-render-contract.json
          git commit -m "Обновить golden-контракт порядка услуг"
          git push origin "HEAD:${GITHUB_REF_NAME}"
