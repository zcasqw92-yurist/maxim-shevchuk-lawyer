name: Независимая live-проверка статьи о контрактном двигателе

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-contract-engine-no-receipt-live.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-live-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_PUBLIC_URL: https://yuristshevchuk.com
      SITE_CANONICAL_URL: https://yuristshevchuk.com
      EXPECTED_BUILD_SHA: 78735c794510419001867a6c0c7e112ffe6523a0
      ARTICLE_URL: https://yuristshevchuk.com/razbory/dengi-za-kontraktnyy-dvigatel-bez-raspiski/
    steps:
      - name: Проверить production workflow и обязательные шаги
        uses: actions/github-script@v7
        with:
          script: |
            const expectedSha = process.env.EXPECTED_BUILD_SHA;
            const requiredSteps = [
              'Build and validate production site',
              'Verify Yandex Metrica goals and funnels',
              'Deploy to GitHub Pages',
              'Verify published build',
              'Verify SHA through custom domain',
              'Recheck all published articles after verified deployment',
              'Notify IndexNow about changed pages',
            ];

            let run;
            for (let attempt = 1; attempt <= 80; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'main',
                event: 'push',
                per_page: 50,
              });
              run = data.workflow_runs.find((item) => item.head_sha === expectedSha && item.name === 'Deploy GitHub Pages');
              if (run?.status === 'completed') break;
              core.info(`Попытка ${attempt}: production run ${run ? `${run.id} — ${run.status}` : 'ещё не найден'}`);
              await new Promise((resolve) => setTimeout(resolve, 15000));
            }

            if (!run) throw new Error(`Production run для ${expectedSha} не найден`);
            if (run.status !== 'completed') throw new Error(`Production run ${run.id} не завершён: ${run.status}`);
            if (run.conclusion !== 'success') throw new Error(`Production run ${run.id} завершён с ${run.conclusion}`);

            const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
              filter: 'latest',
            });
            const job = jobsData.jobs.find((item) => item.name === 'build-and-deploy');
            if (!job || job.conclusion !== 'success') throw new Error('Задание build-and-deploy не завершено успешно');

            for (const name of requiredSteps) {
              const step = job.steps.find((item) => item.name === name);
              if (!step) throw new Error(`Не найден обязательный шаг: ${name}`);
              if (step.conclusion !== 'success') throw new Error(`Шаг «${name}» завершён с ${step.conclusion}`);
            }

            core.notice(`PRODUCTION_RUN_ID=${run.id}`);
            core.notice(`PRODUCTION_RUN_URL=${run.html_url}`);
            core.notice(`PRODUCTION_SHA=${run.head_sha}`);
            core.notice('INDEXNOW_STEP=success');
            core.notice('ALL_PUBLICATIONS_RECHECK=success');

      - name: Получить код проверяемого релиза
        uses: actions/checkout@v4
        with:
          ref: 78735c794510419001867a6c0c7e112ffe6523a0

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить точный SHA, страницу и реестры
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${SITE_PUBLIC_URL}/build-info.json?verify=${GITHUB_RUN_ID}" > build-info.json
          BUILD_INFO="$(cat build-info.json)" node - <<'NODE'
          const info = JSON.parse(process.env.BUILD_INFO);
          if (info.sha !== process.env.EXPECTED_BUILD_SHA) throw new Error(`Получен SHA ${info.sha}`);
          NODE

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${ARTICLE_URL}?verify=${GITHUB_RUN_ID}" > article.html
          grep -Fq 'Деньги за контрактный двигатель передали без расписки: что делать, если мотор не привезли' article.html
          grep -Fq "content=\"${EXPECTED_BUILD_SHA}\"" article.html
          grep -Fq 'Матрица доказательств по оплате контрактного двигателя' article.html
          grep -Fq 'data-editorial-helpfulness' article.html
          ! grep -Eiq '<(form|input|select|textarea)\b' article.html

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${SITE_PUBLIC_URL}/editorial-publications.json?verify=${GITHUB_RUN_ID}" > editorial-publications.json
          MANIFEST="$(cat editorial-publications.json)" node - <<'NODE'
          const manifest = JSON.parse(process.env.MANIFEST);
          if (manifest.counts?.articles !== 20) throw new Error(`Ожидалось 20 статей, получено ${manifest.counts?.articles}`);
          if (manifest.counts?.practiceCases !== 2) throw new Error(`Ожидалось 2 кейса, получено ${manifest.counts?.practiceCases}`);
          const article = manifest.articles?.find((item) => item.slug === 'dengi-za-kontraktnyy-dvigatel-bez-raspiski');
          if (!article || article.status !== 'published') throw new Error('Новая статья отсутствует в публичном реестре');
          NODE

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${SITE_PUBLIC_URL}/sitemap-articles.xml?verify=${GITHUB_RUN_ID}" > sitemap-articles.xml
          grep -Fq "$ARTICLE_URL" sitemap-articles.xml

          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${SITE_PUBLIC_URL}/feed.xml?verify=${GITHUB_RUN_ID}" > feed.xml
          grep -Fq "$ARTICLE_URL" feed.xml

      - name: Установить браузеры
        run: npx playwright install --with-deps chromium webkit

      - name: Перепроверить все опубликованные статьи и кейсы
        run: node scripts/live-all-publications-smoke.mjs

      - name: Итог
        run: echo "Production подтверждён — 20 статей, 2 кейса, SHA ${EXPECTED_BUILD_SHA}"
