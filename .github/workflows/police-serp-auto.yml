name: Полицейский кластер — контрольный SERP-снимок

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: police-inactivity-serp
  cancel-in-progress: true

jobs:
  snapshot:
    environment: seo-api
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Проверить Яндекс через кеш
        env:
          SERP_ENGINE: yandex
          SERP_ALLOW_PAID_REQUESTS: '0'
          SERP_FORCE_REFRESH: '0'
          SERP_QUERY_IDS: ''
          YANDEX_SEARCH_API_KEY: ''
        run: node scripts/run-serp-budgeted.mjs

      - name: Проверить Google через кеш
        env:
          SERP_ENGINE: google
          SERP_ALLOW_PAID_REQUESTS: '0'
          SERP_FORCE_REFRESH: '0'
          SERP_QUERY_IDS: ''
          SERPER_API_KEY: ''
          SERPAPI_API_KEY: ''
        run: node scripts/run-serp-budgeted.mjs

      - name: Показать итог шлюза
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const engine of ['yandex', 'google']) {
            const report = JSON.parse(fs.readFileSync(`reports/serp-snapshots/refund-services/${engine}-api.json`, 'utf8'));
            console.log(`${engine}: gate=${report.gatePassed}; cache_hits=${report.cachePolicy?.cacheHits ?? 0}; paid=${report.cachePolicy?.paidRequestsThisRun ?? 0}`);
          }
          NODE

      - name: Сохранить отчёты
        uses: actions/upload-artifact@v4
        with:
          name: police-inactivity-serp-cache-check
          path: reports/serp-snapshots/refund-services/
          if-no-files-found: error
          retention-days: 14
