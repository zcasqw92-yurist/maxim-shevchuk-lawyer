name: Слепок органической выдачи

on:
  push:
    branches:
      - 'agent/refund-services-serp-snapshot'
    paths:
      - 'config/refund-services-serp.json'
      - 'scripts/serp-snapshot.mjs'
      - 'scripts/yandex-public-serp.mjs'
      - 'scripts/google-public-serp.mjs'
      - '.github/workflows/serp-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  snapshot:
    environment: seo-api
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить Chromium
        run: npx playwright install --with-deps chromium

      - name: Снять публичную выдачу Яндекса
        id: yandex_public
        continue-on-error: true
        run: node scripts/yandex-public-serp.mjs

      - name: Снять Яндекс через Search API и основной Google
        id: serp
        continue-on-error: true
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
        run: node scripts/serp-snapshot.mjs

      - name: Снять Google через резервные официальные домены
        id: google_public
        continue-on-error: true
        run: node scripts/google-public-serp.mjs

      - name: Сохранить отчёт и диагностику
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refund-services-serp-snapshot
          path: reports/serp-snapshots/refund-services/
          if-no-files-found: warn
          retention-days: 14

      - name: Записать результат в pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const readJson = (path) => {
              try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
              catch (error) { core.warning(`${path} unavailable: ${error.message}`); return null; }
            };
            const report = readJson('reports/serp-snapshots/refund-services/latest.json');
            const yandexPublic = readJson('reports/serp-snapshots/refund-services/yandex-public.json');
            const googlePublic = readJson('reports/serp-snapshots/refund-services/google-public.json');
            const yandexById = new Map((yandexPublic?.queries || []).map((item) => [item.id, item]));
            const googleById = new Map((googlePublic?.queries || []).map((item) => [item.id, item]));
            const pickYandex = (item) => item.yandex?.minimumMet
              ? item.yandex
              : (yandexById.get(item.id)?.minimumMet ? yandexById.get(item.id) : (item.yandex || yandexById.get(item.id) || {}));
            const pickGoogle = (item) => googleById.get(item.id)?.minimumMet
              ? googleById.get(item.id)
              : (item.google?.minimumMet ? item.google : (googleById.get(item.id) || item.google || {}));

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/', '')}`;
            const { data: pulls } = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            if (!pulls.length) {
              core.warning(`No open pull request found for ${head}`);
              return;
            }

            const combinedGate = Boolean(
              report?.queries?.length &&
              report.queries.every((item) => pickYandex(item).minimumMet && pickGoogle(item).minimumMet)
            );
            const lines = [
              '## Автоматический SERP-снимок',
              '',
              `Объединённый шлюз пройден: **${combinedGate ? 'да' : 'нет'}**`,
              '',
              '| Гипотеза | Яндекс: органика / реклама | Google: органика / реклама |',
              '|---|---:|---:|',
            ];

            for (const item of report?.queries || []) {
              const yandex = pickYandex(item);
              const google = pickGoogle(item);
              lines.push(`| ${item.query} | ${yandex.organicResultsReviewed ?? 0} / ${yandex.sponsoredResultsObserved ?? 0} (${yandex.status || 'нет'}) | ${google.organicResultsReviewed ?? 0} / ${google.sponsoredResultsObserved ?? 0} (${google.status || 'нет'}) |`);
            }

            const errors = [];
            for (const item of report?.queries || []) {
              const yandex = pickYandex(item);
              const google = pickGoogle(item);
              if (!yandex.minimumMet) errors.push(`Яндекс — ${item.query}: ${yandex.diagnostics?.reason || 'не получено пять органических результатов'}`);
              if (!google.minimumMet) errors.push(`Google — ${item.query}: ${google.diagnostics?.reason || 'не получено пять органических результатов'}`);
            }
            if (errors.length) lines.push('', '### Диагностика', ...errors.slice(0, 12).map((value) => `- ${value}`));

            if (report?.queries?.some((item) => pickYandex(item).minimumMet || pickGoogle(item).minimumMet)) {
              lines.push('', '### Проверенные органические результаты');
              for (const item of report.queries) {
                const yandex = pickYandex(item);
                const google = pickGoogle(item);
                lines.push('', `**${item.query}**`);
                if (yandex.minimumMet) {
                  lines.push(`- Яндекс: ${yandex.organicResults.slice(0, 5).map((entry, index) => `${index + 1}) ${entry.domain} — ${entry.title}`).join('; ')}`);
                }
                if (google.minimumMet) {
                  lines.push(`- Google: ${google.organicResults.slice(0, 5).map((entry, index) => `${index + 1}) ${entry.domain} — ${entry.title}`).join('; ')}`);
                }
              }
            }
            lines.push('', `Workflow commit: \`${context.sha}\``);

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pulls[0].number,
              body: lines.join('\n'),
            });

      - name: Проверить объединённый шлюз
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = (path) => {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch { return null; }
          };
          const report = read('reports/serp-snapshots/refund-services/latest.json');
          const yandexPublic = read('reports/serp-snapshots/refund-services/yandex-public.json');
          const googlePublic = read('reports/serp-snapshots/refund-services/google-public.json');
          const yandexById = new Map((yandexPublic?.queries || []).map((item) => [item.id, item]));
          const googleById = new Map((googlePublic?.queries || []).map((item) => [item.id, item]));
          const passed = Boolean(report?.queries?.length && report.queries.every((item) => {
            const yandex = item.yandex?.minimumMet ? item.yandex : yandexById.get(item.id);
            const google = googleById.get(item.id)?.minimumMet ? googleById.get(item.id) : item.google;
            return Boolean(yandex?.minimumMet && google?.minimumMet);
          }));
          console.log(`Combined SERP gate passed: ${passed}`);
          if (!passed) process.exit(1);
          NODE

# Повторный запуск после пополнения баланса и исправления приоритета источников: 2026-07-31T12:33:00+02:00
