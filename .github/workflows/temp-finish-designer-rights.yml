              config["governedPaths"].append(new_path)
          config_path.write_text(json.dumps(config, ensure_ascii=False, separators=(",", ":")) + "\n", encoding="utf-8")
          
          report_path = Path("reports/cluster-research/designer-infographic-exclusive-rights.md")
          report_path.write_text("# C-025 — договор с дизайнером и права на инфографику\n\nДата проверки: 5 августа 2026 года.\n\n## Решение по владельцу интента\n\nНовая страница становится единственным владельцем ситуации, когда заказчик хочет оформить исключительные права на уже созданную или будущую инфографику, получить исходники и защитить карточку товара от копирования.\n\nЦелевой URL:\n\n`https://yuristshevchuk.com/razbory/dogovor-s-dizaynerom-peredacha-prav-na-infografiku/`\n\nКоммерческий маршрут:\n\n- `/uslugi/spory-biznesa/` — анализ исходных документов, подготовка договора, реестра объектов, заданий и актов;\n- самостоятельный спор о копировании не становится владельцем текущей страницы и рассматривается только после проверки цепочки права.\n\nИсключены запросы:\n\n- регистрация товарного знака;\n- спор о фирменном наименовании;\n- патентование дизайна;\n- готовая жалоба на конкретный маркетплейс;\n- удаление карточки без проверки доказательств;\n- трудовые права штатного дизайнера;\n- налоговая модель работы с самозанятым как самостоятельный интент;\n- обещание конкретной суммы компенсации.\n\n## Внутренние источники\n\n- C-025;\n- диалог `68d42e98-2864-8323-89cb-f1e06033d3ec`;\n- ситуация `SIT-20250924-002`;\n- реплики `R-0203`, `R-0204`.\n\nИсходный сценарий: заказчик заказал инфографику у самозанятого дизайнера, работа уже была выполнена, отношения предполагались постоянными, а готовые материалы, по словам клиента, уже скопировали на Ozon. Клиент хотел полный договор и акт передачи прав.\n\nОплаченная юридическая работа, заключение договора, переход права, доказанное нарушение и положительный результат внутренними источниками не подтверждены. Статья не заявляет, что площадка обязана удалить карточку, что копирование уже доказано или что заказчик вправе получить определённую сумму.\n\n## Проверка существующего сайта\n\nНа сайте есть материал о претензии за товарный знак на маркетплейсе, но он относится к зарегистрированному обозначению и ответу на претензию. Новый материал посвящён авторскому праву на инфографику и оформлению отношений с дизайнером до либо после создания макетов.\n\nСамостоятельного владельца интента о договоре авторского заказа, отчуждении права на готовые макеты, реестре объектов, исходниках и акте на сайте нет.\n\n## Правовая проверка\n\nПроверены действующие на 5 августа 2026 года положения:\n\n- статьи 1227 и 1228 ГК РФ — разграничение материального носителя и исключительного права, определение автора;\n- статья 1234 ГК РФ — письменная форма, вознаграждение и момент перехода исключительного права;\n- статьи 1265, 1266 и 1270 ГК РФ — личные права автора, неприкосновенность произведения и способы использования;\n- статьи 1285 и 1288 ГК РФ — отчуждение права на существующее произведение и договор авторского заказа;\n- статья 1296 ГК РФ и пункт 107 Постановления Пленума Верховного Суда РФ № 10 — разграничение заказа у автора и произведения, созданного подрядчиком, который автором не является;\n- пункт 70 Постановления Пленума Верховного Суда РФ № 10 — судьба требований за нарушение, совершённое до перехода права;\n- статьи 1252.1 и 1301 ГК РФ в редакции, действующей с 4 января 2026 года, — общие правила и способы расчёта компенсации.\n\nЗафиксированы важные ограничения:\n\n1. Передача исходников, файла, доступа или оплата не заменяют письменное оформление исключительного права.\n2. Самозанятость дизайнера не определяет авторство и объём передаваемых прав.\n3. Когда подрядчиком выступает сам автор, нельзя автоматически применять статью 1296 вместо договора авторского заказа.\n4. Возмездное отчуждение требует согласования вознаграждения или порядка его определения.\n5. Личные права автора не отчуждаются; рабочие изменения макета требуют аккуратного согласия.\n6. Дизайнер не может передать больше прав на стоки, шрифты и шаблоны, чем получил сам.\n7. Требование о компенсации за нарушение до перехода исключительного права не переходит к приобретателю автоматически.\n8. Обращение к маркетплейсу и размер судебной компенсации не гарантируются заранее.\n\n## Оригинальный практический элемент\n\n**Проверка цепочки прав на каждый макет**:\n\n`автор → конкретный объект → основание создания → сторонние элементы → вознаграждение → момент перехода → использование и изменения → передача результата → фиксация копирования`\n\nЭлемент помогает:\n\n1. выбрать между договором авторского заказа и отчуждением права на готовую работу;\n2. связать договор с конкретными файлами, версиями и товарами;\n3. проверить лицензии на сторонние элементы;\n4. определить, когда заказчик стал правообладателем;\n5. разделить прошлое и продолжающееся нарушение;\n6. подготовить доказательства для претензии, обращения к площадке или суда.\n\n## Внешняя проверка и ограничение\n\nПрямые подтверждённые снимки минимум пяти органических результатов отдельно в Яндексе и Google не получены. Результаты выдачи не выдумываются. Публикация проводится как контролируемый SEO-эксперимент.\n\nУспех: релевантные органические показы и содержательное чтение либо хотя бы одно квалифицированное обращение о договоре с дизайнером, передаче прав, реестре макетов, исходниках или защите инфографики.\n\nНеуспех: после 90 дней при нормальной индексации отсутствуют релевантные показы, чтение и квалифицированные обращения.\n\nКонтрольные даты: 19 августа, 4 сентября, 4 октября и 3 ноября 2026 года. До достаточной выборки не создавать отдельные конкурирующие URL под акт передачи, исходники, самозанятого дизайнера и копирование инфографики.\n", encoding="utf-8")
          
          manifest_path = Path("reports/content-sessions/latest.json")
