name: Recover Pages infrastructure failure

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  schedule:
    # Страховка на случай, если runner не был выдан самому workflow_run recovery.
    - cron: '52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Recovery не публикует сайт сам. Он может только повторить failed jobs
# исходного Pages run на том же SHA, и только если project code не запускался.
# Перед повтором source SHA обязан всё ещё совпадать с текущим main.
concurrency:
  group: pages-infrastructure-recovery
  cancel-in-progress: false

jobs:
  retry-setup-only:
    name: Retry setup-only hosted runner failure
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      EVENT_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Classify current-main Pages failure and rerun only setup-only jobs
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          main_sha="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 \
            "${auth[@]}" "${api}/git/ref/heads/main" | jq -r '.object.sha')"
          if [[ ! "$main_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Recovery cannot resolve current main SHA." >&2
            exit 1
          fi

          source_run_id="${EVENT_SOURCE_RUN_ID:-}"
          if [[ -z "$source_run_id" || "$source_run_id" == "null" ]]; then
            runs_json="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 \
              "${auth[@]}" "${api}/actions/workflows/pages.yml/runs?branch=main&per_page=50")"
            source_run_id="$(jq -r --arg sha "$main_sha" '
              [.workflow_runs[] | select(.head_sha == $sha)][0]
              | if .status == "completed" and .conclusion == "failure" then (.id | tostring) else "" end
            ' <<<"$runs_json")"
            if [[ -z "$source_run_id" ]]; then
              echo "Scheduled recovery found no latest failed Pages run for current main SHA."
              exit 0
            fi
          fi

          source_json="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 \
            "${auth[@]}" "${api}/actions/runs/${source_run_id}")"
          source_sha="$(jq -r '.head_sha // empty' <<<"$source_json")"
          source_branch="$(jq -r '.head_branch // empty' <<<"$source_json")"
          source_status="$(jq -r '.status // empty' <<<"$source_json")"
          source_conclusion="$(jq -r '.conclusion // empty' <<<"$source_json")"
          attempt="$(jq -r '.run_attempt // 1' <<<"$source_json")"

          if [[ "$source_branch" != "main" || "$source_sha" != "$main_sha" ]]; then
            echo "Recovery blocked: source run is stale (source=${source_sha:-missing}, main=${main_sha})."
            exit 0
          fi
          if [[ "$source_status" != "completed" || "$source_conclusion" != "failure" ]]; then
            echo "Recovery blocked: source Pages run is not a completed failure."
            exit 0
          fi
          if (( attempt >= 3 )); then
            echo "Automatic recovery stopped: source run already reached attempt ${attempt}."
            exit 0
          fi

          jobs_json="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 2 \
            "${auth[@]}" "${api}/actions/runs/${source_run_id}/attempts/${attempt}/jobs?per_page=100")"

          failed_count="$(jq '[.jobs[] | select(.conclusion == "failure")] | length' <<<"${jobs_json}")"
          setup_only_count="$(jq '[.jobs[] | select(.conclusion == "failure") | select(
            ((.steps // []) | length) == 0 or
            (((.steps // []) | length) == 1 and .steps[0].name == "Set up job" and .steps[0].conclusion == "failure")
          )] | length' <<<"${jobs_json}")"

          if (( failed_count == 0 )); then
            echo "Recovery blocked: source run has no failed jobs to rerun."
            exit 0
          fi

          if (( failed_count != setup_only_count )); then
            echo "Recovery blocked: at least one failed job reached repository/deployment logic."
            jq -r '.jobs[] | select(.conclusion == "failure") | "- \(.name): " + (((.steps // []) | map(.name + "=" + (.conclusion // .status // "unknown"))) | join(", "))' <<<"${jobs_json}"
            exit 0
          fi

          echo "All ${failed_count} failed job(s) are setup-only for current main SHA. Re-running failed jobs on the same run/SHA."
          curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
            "${api}/actions/runs/${source_run_id}/rerun-failed-jobs"
