name: Temp finish designer rights article PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temp-finish-designer-rights-pr.yml

permissions:
  contents: write

jobs:
  finish-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/designer-infographic-exclusive-rights
          fetch-depth: 0
      - name: Execute prepared publication patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/temp-finish-designer-rights.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch = textwrap.dedent(source[start:end])
          patch = patch.replace(': false', ': False').replace(': true', ': True')
          exec(compile(patch, '<designer-rights-publication>', 'exec'))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.config.mjs config/content-experiment-exceptions.json reports/cluster-research/designer-infographic-exclusive-rights.md reports/content-sessions/latest.json docs/current-production-state.md
          git commit -m "Завершить регистрацию статьи C-025"
          git push origin HEAD:agent/designer-infographic-exclusive-rights
