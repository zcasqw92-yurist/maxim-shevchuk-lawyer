name: Cleanup C-061 test artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/c061-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout article branch
        uses: actions/checkout@v4
        with:
          ref: agent/c061-unshipped-goods-article
          fetch-depth: 0

      - name: Remove generated test artifacts
        run: |
          rm -rf \
            reports/diploma-layout \
            reports/engagement-nudge \
            reports/hero-consent
          rm -f .github/workflows/c061-cleanup.yml

      - name: Verify clean publication diff
        run: |
          git fetch origin main
          python3 - <<'PY'
          import subprocess

          expected = {
              'config/content-governance.json',
              'docs/current-production-state.md',
              'reports/cluster-research/unshipped-goods-after-invoice.md',
              'reports/content-sessions/latest.json',
              'site.config.mjs',
              'src/editorial-data.mjs',
              'src/unshipped-goods-after-invoice-data.mjs',
          }
          actual = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True,
          ).splitlines())
          actual.discard('.github/workflows/c061-cleanup.yml')
          unexpected = sorted(actual - expected)
          missing = sorted(expected - actual)
          if unexpected or missing:
              raise SystemExit(f'unexpected={unexpected}; missing={missing}')
          print('Publication diff contains exactly seven intended files')
          PY

      - name: Commit clean publication diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Очистить служебные артефакты проверки C-061"
          git push origin HEAD:agent/c061-unshipped-goods-article
