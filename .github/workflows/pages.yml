name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

# Не прерываем уже созданный Pages deployment. GitHub держит максимум один
# pending-run в этой группе; более новый pending автоматически заменяет старый.
concurrency:
  group: pages
  cancel-in-progress: false
  queue: single

env:
  SITE_PRODUCTION: 'true'
  SITE_URL: 'https://yuristshevchuk.com'
  SITE_BASE_PATH: ''
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
  YANDEX_SITE_VERIFICATION: ${{ vars.YANDEX_SITE_VERIFICATION }}
  SITE_ANALYTICS_ENABLED: 'true'
  GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID }}
  YANDEX_METRICA_ID: '111050150'
  YANDEX_METRICA_OAUTH_TOKEN: ${{ secrets.YANDEX_METRICA_OAUTH_TOKEN }}
  SITE_VIDEO_ENABLED: ${{ vars.SITE_VIDEO_ENABLED || 'false' }}
  SITE_VIDEO_TITLE: ${{ vars.SITE_VIDEO_TITLE }}
  SITE_VIDEO_DURATION: ${{ vars.SITE_VIDEO_DURATION }}
  SITE_VIDEO_POSTER: ${{ vars.SITE_VIDEO_POSTER }}
  SITE_VIDEO_WEBM: ${{ vars.SITE_VIDEO_WEBM }}
  SITE_VIDEO_MP4: ${{ vars.SITE_VIDEO_MP4 }}
  SITE_VIDEO_CAPTIONS: ${{ vars.SITE_VIDEO_CAPTIONS }}
  INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
  CROSS_BROWSER_REQUIRED: 'true'
  CONTENT_GOVERNANCE_BASE_SHA: ${{ github.event.before || github.sha }}

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set automated review date
        run: echo "SITE_REVIEW_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.17.0'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic release gate
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/release-check.mjs
          node scripts/release-check.mjs 2>&1 | tee release-check.log

      - name: Upload release diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: release-check-diagnostics-${{ github.run_id }}
          path: |
            release-check.log
            reports
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: '900000'
          error_count: '12'
          reporting_interval: '10000'

  verify:
    name: Verify published site
    needs: deploy
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set automated review date
        run: echo "SITE_REVIEW_DATE=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.17.0'
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-live-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-live-${{ runner.os }}-
            playwright-${{ runner.os }}-

      - name: Install live browser dependencies
        timeout-minutes: 6
        run: npx playwright install-deps chromium webkit

      - name: Install live verification browsers
        timeout-minutes: 6
        run: npx playwright install chromium webkit

      - name: Verify published build
        env:
          SITE_PUBLIC_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -o pipefail
          {
            npm run test:live
            node scripts/live-all-publications-smoke.mjs
          } 2>&1 | tee live-verify.log

      - name: Verify SHA through custom domain
        env:
          SITE_CUSTOM_DOMAIN_URL: ${{ env.SITE_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          CUSTOM_DOMAIN_VERIFY_ATTEMPTS: '30'
          CUSTOM_DOMAIN_VERIFY_DELAY_MS: '10000'
        run: node scripts/verify-custom-domain-sha.mjs

      - name: Recheck all published articles after verified deployment
        env:
          SITE_PUBLIC_URL: ${{ env.SITE_URL }}
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node scripts/live-public-copy-regression-test.mjs

      - name: Verify Yandex Metrica goals and funnels
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/metrica-state-test.mjs 2>&1 | tee metrica-state.log

      - name: Upload custom-domain and public-copy diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: live-deploy-diagnostics-${{ github.run_id }}
          path: |
            live-verify.log
            metrica-state.log
            reports/live-publication-smoke.json
            reports/custom-domain-sha-verification.json
            reports/public-copy-regression.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify IndexNow about changed pages
        if: github.event_name != 'schedule'
        run: INDEXNOW_CHANGED_DATE="$SITE_REVIEW_DATE" npm run submit:indexnow
